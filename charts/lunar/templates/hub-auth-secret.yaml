{{/*
Chart-managed Hub auth token. Rendered when hub.auth.secretName is empty.
Uses lookup to read the existing chart-managed secret on upgrade so the
token survives chart-version bumps and value changes; falls back to a
random 48-char alphanumeric on first install.

The secret is annotated helm.sh/resource-policy: keep so it survives
helm uninstall — recreating the chart with a different token would break
every CLI / agent / operator pointing at this Hub.

GitOps note: lookup returns empty during client-side render (ArgoCD,
helm template). For GitOps installs, set hub.auth.secretName to a
pre-managed secret instead, or add ignoreDifferences for the secret's
data path in your Application spec. See README.
*/}}
{{- if not .Values.hub.auth.secretName -}}
{{- $name := include "lunar.hubAuthSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $token := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.hub.auth.secretKey) -}}
{{- $token = index $existing.data .Values.hub.auth.secretKey | b64dec -}}
{{- else -}}
{{- $token = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.hub.auth.secretKey }}: {{ $token | b64enc | quote }}
{{- end }}
