{{/*
Chart-managed password for the read-only sqlapi_user DB role — the credential in
the connection string `lunar sql connection-string` vends. Rendered only in
mode=generate: mode=secret reads a Secret the operator manages, and
mode=unmanaged sets nothing at all.

Random 32-char ALPHANUMERIC, and the character set is load-bearing.
GetSQLAPIConnectionString builds "postgres://user:pass@host:port/db?opts" with a
bare fmt.Sprintf and no percent-encoding, so an '@', '/', ':' or '#' in the
password yields a string clients cannot parse. Don't "improve" this to include
symbols.

Before chart 3.19.0 there was no default at all, and an unset password did not
mean an empty one: 01_sqlapi/user.sql omits the PASSWORD clause entirely, so a
fresh database got a role with a NULL verifier that could not authenticate by
any means — while the Hub cheerfully vended "postgres://sqlapi_user:@...". Only
greenfield installs were affected, since an already-migrated DB kept whatever
password it was first created with. Generating here makes that unreachable.

Same hook shape as grafana-db-secret.yaml: pre-install/pre-upgrade weighted BELOW
the migrate Job (-10 < -5), so the Secret exists before that Job creates the role
WITH this password, and before the hub Deployment reads it.

resource-policy: keep + the lookup guard render it ONCE, and here that is about
the customer rather than the database. 01_sqlapi is re-applied in full on every
migrate run, so a freshly-generated password would in fact propagate correctly —
and would rotate this credential on every single upgrade. This is the one
credential Lunar hands out: `lunar sql connection-string` output ends up in BI
tools and saved psql invocations, so it has to survive an upgrade unchanged.
TestSQLAPIPasswordHealsAPasswordlessRole in hub/testdb pins the re-apply,
including over a password changed behind the migration's back.

See hub-auth-secret.yaml for the lookup / GitOps caveats (use mode=secret for
GitOps).
*/}}
{{- if eq .Values.hub.db.sqlapiPassword.mode "generate" -}}
{{- $name := include "lunar.sqlapiDBSecretName" . -}}
{{- $key := .Values.hub.db.sqlapiPassword.passwordKey -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
