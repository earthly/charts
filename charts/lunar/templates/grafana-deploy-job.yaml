{{/*
Grafana content deploy hook. Runs the lunar-dashboards image (deploy.sh) as a
post-install/post-upgrade hook so plugins/datasources/dashboards are installed on
every Hub install/upgrade — into our stock Grafana pod (GRAFANA_URL points at the
in-cluster Service) or a customer Grafana (endpoint resolved from the Hub).

Non-blocking by default (dashboardsDeploy.blocking=false): a failed deploy is
logged but exits 0 so it never fails/rolls back the Hub upgrade — the Hub is the
product; dashboards are a convenience. The reconverge sidecar on the Grafana pod
and the next upgrade both re-converge. Set blocking=true to gate the release.

hook-weight 5 runs it after the hub Deployment; deploy.sh talks to the Hub over
gRPC, so backoffLimit covers the hub not being Ready the instant the hook fires.
*/}}
{{- if and .Values.grafana.dashboardsDeploy.enabled (or .Values.grafana.enabled .Values.grafana.externalURL) -}}
{{- $img := printf "%s:%s" .Values.grafana.dashboardsDeploy.image.repository (.Values.grafana.dashboardsDeploy.image.tag | default .Values.hub.image.tag) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lunar.fullname" . }}-grafana-deploy
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-deploy
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.grafana.dashboardsDeploy.backoffLimit }}
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana-deploy
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.grafana.enabled }}
      initContainers:
        - name: wait-for-grafana
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.grafana.dashboardsDeploy.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - until curl -fsS "http://{{ include "lunar.fullname" . }}-grafana:{{ .Values.grafana.service.port }}/api/health" >/dev/null 2>&1; do echo "waiting for grafana..."; sleep 2; done
      {{- end }}
      containers:
        - name: deploy
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.grafana.dashboardsDeploy.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if /deploy.sh; then exit 0; fi
              echo "grafana dashboard deploy failed" >&2
              {{- if .Values.grafana.dashboardsDeploy.blocking }}
              exit 1
              {{- else }}
              exit 0
              {{- end }}
          env:
            {{- if .Values.grafana.enabled }}
            # Our in-cluster pod: the Hub's grafana URL is the external PR-link URL,
            # so target the in-cluster Service instead (its kiosk proxy forwards
            # /api to Grafana with basic-auth intact).
            - name: GRAFANA_URL
              value: "http://{{ include "lunar.fullname" . }}-grafana:{{ .Values.grafana.service.port }}"
            {{- end }}
            {{- include "lunar.grafanaDeployHubEnv" . | nindent 12 }}
{{- end }}
