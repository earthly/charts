{{/*
Grafana content deploy hook. Runs the lunar-dashboards image (deploy.sh) as a
post-install/post-upgrade hook so plugins/datasources/dashboards are (re)installed
into the Grafana pod on every Hub install/upgrade. GRAFANA_URL points at the
in-cluster Service (its kiosk proxy forwards /api to Grafana with basic-auth
intact); everything else deploy.sh resolves from the Hub over gRPC.

Non-blocking: a failed deploy is logged but exits 0 so it never fails/rolls back
the Hub upgrade — the Hub is the product, dashboards are a convenience, and the
reconverge sidecar + next upgrade re-converge. hook-weight 5 runs it after the hub
Deployment; a fixed backoffLimit covers the hub not being Ready when the hook fires.
*/}}
{{- if and .Values.grafana.enabled .Values.grafana.dashboardsDeploy.enabled -}}
{{- $img := printf "%s:%s" .Values.grafana.dashboardsDeploy.image.repository (.Values.grafana.dashboardsDeploy.image.tag | default .Values.hub.image.tag) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lunar.fullname" . }}-grafana-deploy
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana-deploy
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana-deploy
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-grafana
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.grafana.dashboardsDeploy.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - until curl -fsS "http://{{ include "lunar.fullname" . }}-grafana:{{ .Values.grafana.service.port }}/api/health" >/dev/null 2>&1; do echo "waiting for grafana..."; sleep 2; done
      containers:
        - name: deploy
          image: {{ $img | quote }}
          imagePullPolicy: {{ .Values.grafana.dashboardsDeploy.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              if /deploy.sh; then exit 0; fi
              # Non-blocking: log but exit 0 so a failed deploy never fails/rolls
              # back the Hub upgrade; the sidecar + next upgrade re-converge.
              echo "grafana dashboard deploy failed" >&2
              exit 0
          env:
            # Target the in-cluster Service (its kiosk proxy forwards /api to
            # Grafana with basic-auth intact); the Hub's grafana URL is the
            # external PR-link URL, not the in-cluster address.
            - name: GRAFANA_URL
              value: "http://{{ include "lunar.fullname" . }}-grafana:{{ .Values.grafana.service.port }}"
            {{- include "lunar.grafanaDeployHubEnv" . | nindent 12 }}
{{- end }}
