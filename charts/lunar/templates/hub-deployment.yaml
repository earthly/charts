{{- include "lunar.forgeAuthCheck" . }}
{{- include "lunar.hubLicenceCheck" . }}
{{- include "lunar.rejectLegacyIngressShape" . }}
{{- include "lunar.validateGrafana" . }}
{{- $webhookURL := include "lunar.webhookURL" . -}}
{{- $grafanaURL := include "lunar.grafanaURL" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar.fullname" . }}-hub
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  {{- with .Values.hub.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.hub.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "lunar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hub
  template:
    metadata:
      {{- with .Values.hub.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: hub
        {{- with .Values.hub.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lunar.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.hub.terminationGracePeriodSeconds | default 60 }}
      {{- with .Values.hub.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # DB migrations run once per release as a pre-rollout hook Job
      # (hub-migrate-job.yaml), not here — the hub server asserts the schema is
      # current at boot and refuses to start if it's behind.
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.hub.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.hub.image.repository }}:{{ .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          {{- with .Values.hub }}
          env:
            - name: HUB_DB_NAME
              value: {{ .db.name | quote }}
            - name: HUB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .db.user.secretName }}
                  key: {{ .db.user.secretKey }}
            - name: HUB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .db.pass.secretName }}
                  key: {{ .db.pass.secretKey }}
            - name: HUB_DB_HOST
              value: {{ .db.host | quote }}
            - name: HUB_DB_PORT
              value: {{ .db.port | quote }}
            - name: HUB_DB_WAIT_SECS
              value: {{ .db.waitSecs | quote }}
            - name: HUB_DB_CONNECTION_OPTIONS
              value: {{ include "lunar.libpqOptions" .db.connectionOptions | quote }}
            # The hub hands this to SQL API clients rather than dialing with it,
            # so it renders as a URL query: it lands after the "?" of the
            # postgres:// string the hub vends. Unset, SQL API clients get the
            # hub's own options.
            - name: HUB_SQLAPI_CONNECTION_OPTIONS
              value: {{ include "lunar.urlQueryOptions" (.db.sqlapiConnectionOptions | default .db.connectionOptions) | quote }}
            - name: HUB_DB_MAX_OPEN_CONNS
              value: {{ .db.maxOpenConns | quote }}
            - name: HUB_DB_MAX_POOL_CONNS
              value: {{ .db.maxPoolConns | quote }}
            - name: HUB_MAX_OPERATOR_POOL_SIZE
              value: {{ .db.operatorPoolSize | quote }}
            - name: HUB_DB_MIGRATIONS_PATH
              value: "/usr/share/migrations"
            {{- if include "lunar.githubConfigured" $ }}
            - name: HUB_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.hubWebhookSecretName" $ }}
                  key: {{ .github.webhookSecret.secretKey }}
            - name: HUB_GITHUB_SYNC_WINDOW
              value: {{ .github.syncWindow | quote }}
            - name: HUB_GITHUB_BASE_URL
              value: {{ .github.baseUrl | quote }}
            {{- if gt (len .github.apps) 0 }}
            - name: HUB_GITHUB_APPS
              value: {{ include "lunar.githubAppsJSON" $ | quote }}
            {{- else }}
            - name: HUB_GITHUB_APP_OWNER
              value: {{ .github.app.owner | quote }}
            - name: HUB_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .github.app.privateKey.secretName }}
                  key: {{ .github.app.privateKey.secretKey }}
            - name: HUB_GITHUB_APP_ID
              value: {{ .github.app.id | quote }}
            - name: HUB_GITHUB_APP_INSTALL_ID
              value: {{ .github.app.installId | quote }}
            {{- end }}
            {{- end }}
            {{- if gt (len .gitlab.tokens) 0 }}
            - name: HUB_GITLAB_TOKENS
              value: {{ include "lunar.gitlabTokensJSON" $ | quote }}
            # Operator-level webhook-signing fallback; per-entry
            # webhook_secret in the JSON (advanced) wins where set.
            - name: HUB_GITLAB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.hubGitlabWebhookSecretName" $ }}
                  key: {{ .gitlab.webhookSecret.secretKey }}
            {{- end }}
            - name: HUB_POLICY_QUEUE_POLL_INTERVAL
              value: {{ .policyQueue.pollInterval | quote }}
            - name: HUB_POLICY_QUEUE_NUM_WORKERS
              value: {{ .policyQueue.numWorkers | quote }}
            - name: HUB_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.hubAuthSecretName" $ }}
                  key: {{ .auth.secretKey }}
            - name: HUB_LICENCE_FILE
              value: {{ .licence.filePath | quote }}
            {{- if and .secrets.collector.secretName (not .secrets.collector.perKey) }}
            - name: HUB_COLLECTOR_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .secrets.collector.secretName }}
                  key: {{ .secrets.collector.secretKey }}
            {{- end }}
            {{- if and .secrets.cataloger.secretName (not .secrets.cataloger.perKey) }}
            - name: HUB_CATALOGER_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .secrets.cataloger.secretName }}
                  key: {{ .secrets.cataloger.secretKey }}
            {{- end }}
            {{- if and .secrets.policy.secretName (not .secrets.policy.perKey) }}
            - name: HUB_POLICY_SECRETS
              valueFrom:
                secretKeyRef:
                  name: {{ .secrets.policy.secretName }}
                  key: {{ .secrets.policy.secretKey }}
            {{- end }}
            - name: HUB_LOG_LEVEL
              value: {{ $.Values.logging.level | quote }}
            - name: HUB_LOG_FORMAT
              value: {{ $.Values.logging.format | quote }}
            - name: HUB_LOGS_AWS_BUCKET
              value: {{ .s3.logsBucket | quote }}
            - name: HUB_RESOURCES_AWS_BUCKET
              value: {{ .s3.resourcesBucket | quote }}
            - name: HUB_LOGS_AWS_URL_TTL
              value: {{ .s3.logsUrlTtl | quote }}
            - name: HUB_RESOURCES_AWS_URL_TTL
              value: {{ .s3.resourcesUrlTtl | quote }}
            {{- with $webhookURL }}
            - name: HUB_PUBLIC_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $grafanaURL }}
            - name: HUB_GRAFANA_URL_BASE
              value: {{ . | quote }}
            {{- end }}
            {{- if eq $.Values.grafana.mode "chart" }}
            # Bundled pod: basic admin creds (generated or BYO) the Hub vends to the
            # lunar-dashboards provisioning tool via GetGrafanaEndpoint.
            - name: HUB_GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAuthSecretName" $ }}
                  key: {{ $.Values.grafana.auth.userKey }}
            - name: HUB_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAuthSecretName" $ }}
                  key: {{ $.Values.grafana.auth.passwordKey }}
            {{- else if eq $.Values.grafana.mode "external" }}
            # External Grafana: operator-supplied creds (grafana.auth.secretName) the
            # Hub authenticates with — a service-account token (auth.tokenKey, for
            # Grafana Cloud/Enterprise) or basic user/password (OSS).
            {{- if $.Values.grafana.auth.tokenKey }}
            - name: HUB_GRAFANA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAuthSecretName" $ }}
                  key: {{ $.Values.grafana.auth.tokenKey }}
            {{- else }}
            - name: HUB_GRAFANA_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAuthSecretName" $ }}
                  key: {{ $.Values.grafana.auth.userKey }}
            - name: HUB_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAuthSecretName" $ }}
                  key: {{ $.Values.grafana.auth.passwordKey }}
            {{- end }}
            {{- end }}
            {{- if ne $.Values.grafana.mode "off" }}
            # Read-only grafana_user password: the Hub embeds it in the read-only
            # Postgres connection string GetGrafanaConnectionString vends to the
            # provisioning tool. Chart-generated (grafana-db secret); needed whenever
            # grafana.mode != off, including external Grafana (mode=external).
            - name: HUB_GRAFANA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaDBSecretName" $ }}
                  key: {{ $.Values.grafana.provisioning.dbPassword.passwordKey }}
            # The datasource points at the hub's own database (the hub fills in
            # host, port and name from its own config), so it takes the hub's
            # own options — rendered as a URL query, since this too is vended as
            # a postgres:// string and not dialed here.
            - name: HUB_GRAFANA_DB_CONNECTION_OPTIONS
              value: {{ include "lunar.urlQueryOptions" $.Values.hub.db.connectionOptions | quote }}
            {{- end }}
            - name: HUB_K8S_EXECUTION_ENABLED
              value: "true"
            - name: HUB_MAX_WORKERS_COLLECT
              value: {{ .maxWorkers.collect | quote }}
            - name: HUB_MAX_WORKERS_POLICY
              value: {{ .maxWorkers.policy | quote }}
            - name: HUB_MAX_WORKERS_CRON_COLLECT
              value: {{ .maxWorkers.cronCollect | quote }}
            - name: HUB_MAX_WORKERS_CATALOGER
              value: {{ .maxWorkers.cataloger | quote }}
            - name: HUB_GRPC_MAX_CONNECTION_AGE
              value: {{ .grpc.maxConnectionAge | quote }}
            - name: HUB_GRPC_MAX_CONNECTION_AGE_GRACE
              value: {{ .grpc.maxConnectionAgeGrace | quote }}
            {{- with .extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or (and .secrets.collector.secretName .secrets.collector.perKey) (and .secrets.cataloger.secretName .secrets.cataloger.perKey) (and .secrets.policy.secretName .secrets.policy.perKey) }}
          envFrom:
            {{- if and .secrets.collector.secretName .secrets.collector.perKey }}
            - secretRef:
                name: {{ .secrets.collector.secretName }}
              prefix: HUB_COLLECTOR_SECRET_
            {{- end }}
            {{- if and .secrets.cataloger.secretName .secrets.cataloger.perKey }}
            - secretRef:
                name: {{ .secrets.cataloger.secretName }}
              prefix: HUB_CATALOGER_SECRET_
            {{- end }}
            {{- if and .secrets.policy.secretName .secrets.policy.perKey }}
            - secretRef:
                name: {{ .secrets.policy.secretName }}
              prefix: HUB_POLICY_SECRET_
            {{- end }}
          {{- end }}
          {{- end }}
          {{- if .Values.hub.livenessProbe.enabled }}
          {{- with .Values.hub.livenessProbe }}
          livenessProbe:
            httpGet:
              path: /health
              port: hub-health
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- if .Values.hub.readinessProbe.enabled }}
          {{- with .Values.hub.readinessProbe }}
          readinessProbe:
            httpGet:
              path: /ready
              port: hub-health
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}
          {{- if gt (int .Values.hub.preStopSleepSeconds) 0 }}
          # Sleep before SIGTERM so k8s deregisters this pod from the Service
          # (endpoint removal on deletion) before the hub starts draining —
          # graceful shutdown, R4. Must leave room under
          # terminationGracePeriodSeconds for the hub's own drain.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.hub.preStopSleepSeconds }}"]
          {{- end }}
          ports:
            - name: hub-grpc
              containerPort: 8000
              protocol: TCP
            - name: hub-http
              containerPort: 8001
              protocol: TCP
            - name: hub-health
              containerPort: 8002
              protocol: TCP
          {{- with .Values.hub.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: hub-data
              mountPath: /var/lib/lunar
            - name: hub-licence
              mountPath: {{ .Values.hub.licence.filePath | quote }}
              subPath: {{ base .Values.hub.licence.filePath | quote }}
              readOnly: true
            {{- if gt (len .Values.hub.github.apps) 0 }}
            - name: github-apps
              mountPath: /secrets/github-apps
              readOnly: true
            {{- end }}
            {{- if gt (len .Values.hub.gitlab.tokens) 0 }}
            - name: gitlab-token
              mountPath: /secrets/gitlab
              readOnly: true
            {{- end }}
            {{- with .Values.hub.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

      volumes:
        # /var/lib/lunar holds no durable state — re-extracted runtimes and a
        # rebuildable snippet-code cache (code is served from S3, B1) — so it's
        # an ephemeral emptyDir, not a PVC. This lets the hub run N>1 replicas
        # with a RollingUpdate (no shared RWO PVC to contend for).
        - name: hub-data
          emptyDir:
            sizeLimit: {{ .Values.hub.stateDir.sizeLimit }}
        - name: hub-licence
          secret:
            secretName: {{ .Values.hub.licence.secretName }}
            items:
              - key: {{ .Values.hub.licence.secretKey }}
                path: {{ base .Values.hub.licence.filePath | quote }}
        {{- if gt (len .Values.hub.github.apps) 0 }}
        - name: github-apps
          secret:
            secretName: {{ .Values.hub.github.appsSecret.secretName }}
        {{- end }}
        {{- if gt (len .Values.hub.gitlab.tokens) 0 }}
        - name: gitlab-token
          secret:
            secretName: {{ .Values.hub.gitlab.tokensSecret.secretName }}
        {{- end }}
        {{- with .Values.hub.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.hub.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hub.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      # Default: soft-spread hub replicas across nodes so a single node loss
      # can't take down the whole hub — the PDB only guards *voluntary*
      # disruptions (drains), not a node crash. ScheduleAnyway keeps small /
      # single-node clusters schedulable (and is a no-op at replicaCount 1).
      # Override hub.topologySpreadConstraints for a stricter spread (e.g. a
      # hard zone spread with DoNotSchedule).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "lunar.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: hub
      {{- end }}
