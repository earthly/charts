{{/*
Chart-managed secret Grafana presents to the Hub when it signs people in
through it (grafana.sso). Rendered when sso is enabled and
grafana.sso.clientSecret.secretName is empty, in every Grafana mode but off:
in external modes the operator reads it back to configure their Grafana. See
hub-auth-secret.yaml for the lookup / regenerate / GitOps caveats — same
pattern.
*/}}
{{- if and .Values.grafana.sso.enabled (ne .Values.grafana.mode "off") (not .Values.grafana.sso.clientSecret.secretName) -}}
{{- $name := include "lunar.grafanaSSOSecretName" . -}}
{{- $key := .Values.grafana.sso.clientSecret.secretKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := "" -}}
{{- if and $existing $existing.data (index $existing.data $key) -}}
{{- $secret = index $existing.data $key | b64dec -}}
{{- else -}}
{{- $secret = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $secret | b64enc | quote }}
{{- end }}
