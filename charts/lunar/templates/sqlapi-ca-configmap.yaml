{{- if .Values.hub.db.sqlapiSslRootCert -}}
{{/*
A ConfigMap rather than a Secret on purpose: these are public CA certificates,
and the whole point of the bundle is that it gets handed out — the Hub vends its
contents to every SQL API client that asks for a connection string.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lunar.fullname" . }}-sqlapi-ca
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
data:
  ca-bundle.pem: |
    {{- .Values.hub.db.sqlapiSslRootCert | nindent 4 }}
{{- end }}
