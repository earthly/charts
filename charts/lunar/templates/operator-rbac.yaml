apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "lunar.fullname" . }}-operator
  namespace: {{ include "lunar.scriptNamespace" . }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election for multi-replica operators (controller-runtime Manager LE).
  # The Lease lives in OPERATOR_NAMESPACE, which is this Role's namespace
  # (scriptNamespace); whichever replica holds it runs the pod-GC reconciler.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "lunar.fullname" . }}-operator
  namespace: {{ include "lunar.scriptNamespace" . }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
subjects:
  - kind: ServiceAccount
    name: {{ include "lunar.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "lunar.fullname" . }}-operator
  apiGroup: rbac.authorization.k8s.io
