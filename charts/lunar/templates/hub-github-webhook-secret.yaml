{{/*
Chart-managed GitHub webhook secret. Rendered when
hub.github.webhookSecret.secretName is empty. See hub-auth-secret.yaml
for the lookup / regenerate / GitOps caveats — same pattern.
*/}}
{{- if not .Values.hub.github.webhookSecret.secretName -}}
{{- $name := include "lunar.hubWebhookSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.hub.github.webhookSecret.secretKey) -}}
{{- $secret = index $existing.data .Values.hub.github.webhookSecret.secretKey | b64dec -}}
{{- else -}}
{{- $secret = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.hub.github.webhookSecret.secretKey }}: {{ $secret | b64enc | quote }}
{{- end }}
