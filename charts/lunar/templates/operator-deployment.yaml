apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar.fullname" . }}-operator
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  {{- with .Values.operator.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.operator.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "lunar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      {{- with .Values.operator.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: operator
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lunar.fullname" . }}-operator
      {{- with .Values.operator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          {{- with .Values.operator.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.operator.healthPort }}
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
          env:
            - name: OPERATOR_DB_NAME
              value: {{ .Values.hub.db.name | quote }}
            - name: OPERATOR_DB_HOST
              value: {{ .Values.hub.db.host | quote }}
            - name: OPERATOR_DB_PORT
              value: {{ .Values.hub.db.port | quote }}
            - name: OPERATOR_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.db.user.secretName }}
                  key: {{ .Values.hub.db.user.secretKey }}
            - name: OPERATOR_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hub.db.pass.secretName }}
                  key: {{ .Values.hub.db.pass.secretKey }}
            - name: OPERATOR_DB_CONNECTION_OPTIONS
              value: {{ .Values.hub.db.connectionOptions | quote }}
            - name: OPERATOR_NAMESPACE
              value: {{ include "lunar.scriptNamespace" . | quote }}
            - name: OPERATOR_MAX_CONCURRENT
              value: {{ .Values.operator.maxConcurrent | quote }}
            - name: OPERATOR_HEALTH_PORT
              value: {{ .Values.operator.healthPort | quote }}
            - name: LUNAR_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LUNAR_LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: OPERATOR_INIT_IMAGE
              value: "{{ .Values.operator.initImage.repository }}:{{ .Values.operator.initImage.tag }}"
            - name: OPERATOR_SIDECAR_IMAGE
              value: "{{ .Values.operator.sidecarImage.repository }}:{{ .Values.operator.sidecarImage.tag }}"
            - name: OPERATOR_HUB_HOST
              value: {{ .Values.operator.hubHost | default (include "lunar.hubHost" .) | quote }}
            - name: OPERATOR_HUB_GRPC_PORT
              value: {{ .Values.hub.service.ports.server | quote }}
            - name: OPERATOR_HUB_HTTP_PORT
              value: {{ .Values.hub.service.ports.http | quote }}
            - name: OPERATOR_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.hubAuthSecretName" . }}
                  key: {{ .Values.hub.auth.secretKey }}
            - name: OPERATOR_HUB_INSECURE
              value: "true"
            - name: OPERATOR_POD_SERVICE_ACCOUNT
              value: {{ include "lunar.fullname" . }}-script-pod
            {{- if .Values.imagePullSecrets }}
            - name: OPERATOR_IMAGE_PULL_SECRETS
              value: {{ range $i, $s := .Values.imagePullSecrets }}{{ if $i }},{{ end }}{{ $s.name }}{{ end }}
            {{- end }}
            {{- if not (eq (toJson .Values.operator.scriptContainerSpecPolicy) "{}") }}
            - name: OPERATOR_SNIPPET_CONTAINER_SPEC_POLICY
              value: {{ .Values.operator.scriptContainerSpecPolicy | toJson | quote }}
            {{- end }}
            {{- if not (eq (toJson .Values.operator.scriptContainerSpecCollector) "{}") }}
            - name: OPERATOR_SNIPPET_CONTAINER_SPEC_COLLECTOR
              value: {{ .Values.operator.scriptContainerSpecCollector | toJson | quote }}
            {{- end }}
            {{- if not (eq (toJson .Values.operator.scriptContainerSpecCataloger) "{}") }}
            - name: OPERATOR_SNIPPET_CONTAINER_SPEC_CATALOGER
              value: {{ .Values.operator.scriptContainerSpecCataloger | toJson | quote }}
            {{- end }}
            {{- if gt (int .Values.operator.batchMaxCountPolicy) 0 }}
            - name: OPERATOR_BATCH_MAX_COUNT_POLICY
              value: {{ .Values.operator.batchMaxCountPolicy | quote }}
            {{- end }}
            {{- if gt (int .Values.operator.batchMaxCountCollector) 0 }}
            - name: OPERATOR_BATCH_MAX_COUNT_COLLECTOR
              value: {{ .Values.operator.batchMaxCountCollector | quote }}
            {{- end }}
            {{- if gt (int .Values.operator.batchMaxCountCataloger) 0 }}
            - name: OPERATOR_BATCH_MAX_COUNT_CATALOGER
              value: {{ .Values.operator.batchMaxCountCataloger | quote }}
            {{- end }}
            {{- if not (eq (toJson .Values.operator.scriptPodNodeSelector) "{}") }}
            - name: OPERATOR_SNIPPET_POD_NODE_SELECTOR
              value: {{ .Values.operator.scriptPodNodeSelector | toJson | quote }}
            {{- end }}
            {{- if .Values.operator.scriptPodTolerations }}
            - name: OPERATOR_SNIPPET_POD_TOLERATIONS
              value: {{ .Values.operator.scriptPodTolerations | toJson | quote }}
            {{- end }}
            {{- if .Values.operator.scriptPodPriorityClassName }}
            - name: OPERATOR_SNIPPET_POD_PRIORITY_CLASS_NAME
              value: {{ .Values.operator.scriptPodPriorityClassName | quote }}
            {{- end }}
            {{- with .Values.operator.extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.operator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
