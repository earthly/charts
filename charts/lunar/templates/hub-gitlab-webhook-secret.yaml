{{/*
Chart-managed GitLab webhook-signing secret. Rendered when GitLab is
configured and hub.gitlab.webhookSecret.secretName is empty. Unlike the
GitHub twin there is no paste-back step: the Hub registers project hooks
itself and stamps this secret on them (delivered as
HUB_GITLAB_WEBHOOK_SECRET). See hub-auth-secret.yaml for the lookup /
regenerate / GitOps caveats — same pattern.
*/}}
{{- if and (gt (len .Values.hub.gitlab.tokens) 0) (not .Values.hub.gitlab.webhookSecret.secretName) -}}
{{- $name := include "lunar.hubGitlabWebhookSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $secret := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.hub.gitlab.webhookSecret.secretKey) -}}
{{- $secret = index $existing.data .Values.hub.gitlab.webhookSecret.secretKey | b64dec -}}
{{- else -}}
{{- $secret = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.hub.gitlab.webhookSecret.secretKey }}: {{ $secret | b64enc | quote }}
{{- end }}
