{{- if eq .Values.grafana.mode "chart" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lunar.fullname" . }}-grafana-kiosk
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
data:
  default.conf: |
    # Inject ?kiosk into Grafana dashboard URLs to hide the default menu.
    # Replicates the Caddy rewrite rules from the docker-compose setup.

    map $args $has_kiosk {
        "~(^|&)kiosk(=|&|$)"  1;
        default                0;
    }

    map $is_args $kiosk_suffix {
        "?"     "&kiosk";
        default "?kiosk";
    }

    server {
        listen 8080;
        absolute_redirect off;

        location = / {
            if ($has_kiosk = 0) {
                return 302 /$is_args$args$kiosk_suffix;
            }
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location ~ ^/(d|dashboard)/ {
            if ($has_kiosk = 0) {
                return 302 $uri$is_args$args$kiosk_suffix;
            }
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://localhost:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
{{- if .Values.grafana.sso.enabled }}

        # Sign-in through the Hub (grafana.sso): the Hub serves the OAuth
        # endpoints Grafana sends the browser to, and they must live on
        # Grafana's own origin — the sign-in rides a cookie set there, and the
        # sign-out tells a press of Grafana's login button from an auto-login by
        # the page that referred it. Routing them here, in front of Grafana,
        # makes that true for whatever reaches this Service: the chart's
        # ingress, yours, or a port-forward.
        location ^~ /oauth/ {
            proxy_pass http://{{ include "lunar.fullname" . }}-hub:{{ .Values.hub.service.ports.http }};
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
{{- end }}
    }
{{- end }}
