{{- if .Values.grafana.enabled -}}
{{- $grafanaURL := include "lunar.grafanaURL" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar.fullname" . }}-grafana
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  {{- with .Values.grafana.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lunar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      {{- with .Values.grafana.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
        {{- with .Values.grafana.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lunar.serviceAccountName" . }}
      {{- with .Values.grafana.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.grafana.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          {{- with .Values.grafana }}
          env:
            {{- with $grafanaURL }}
            - name: GF_SERVER_ROOT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAdminSecretName" $ }}
                  key: {{ .admin.userKey }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAdminSecretName" $ }}
                  key: {{ .admin.passwordKey }}
            # Stock upstream Grafana: plugins, datasources and dashboards are
            # installed over the API by the lunar-dashboards deploy tool (the
            # deploy hook Job + reconverge sidecar), not baked into the image, so
            # the only server-level knob we set is sign-up. Override via extraEnv.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            {{- with .extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.grafana.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: kiosk
          image: nginx:1-alpine
          ports:
            - name: kiosk
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: kiosk-config
              mountPath: /etc/nginx/conf.d
        {{- if .Values.grafana.dashboardsDeploy.enabled }}
        - name: dashboards-reconverge
          # Re-applies plugins/datasources/dashboards on every pod start so the
          # Grafana pod is stateless/self-healing — a recreated pod (or lost
          # volume) converges back without waiting for the next Hub upgrade.
          # deploy.sh resolves the Grafana endpoint + read-only DB connection from
          # the Hub; GRAFANA_URL points at the Grafana container in this pod.
          image: "{{ .Values.grafana.dashboardsDeploy.image.repository }}:{{ .Values.grafana.dashboardsDeploy.image.tag | default .Values.hub.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.dashboardsDeploy.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -fsS "$GRAFANA_URL/api/health" >/dev/null 2>&1; do
                echo "waiting for grafana..."; sleep 2;
              done
              /deploy.sh || echo "dashboards reconverge failed" >&2
              # Idle so the Deployment treats this as a long-lived sidecar; it
              # re-applies on the next pod (re)start.
              tail -f /dev/null
          env:
            - name: GRAFANA_URL
              value: "http://localhost:3000"
            {{- include "lunar.grafanaDeployHubEnv" . | nindent 12 }}
        {{- end }}
      {{- range .Values.grafana.volumes }}
      {{- if eq .name "kiosk-config" }}
      {{- fail "Values.grafana.volumes contains reserved name 'kiosk-config'" }}
      {{- end }}
      {{- end }}
      volumes:
        - name: kiosk-config
          configMap:
            name: {{ include "lunar.fullname" . }}-grafana-kiosk
        {{- with .Values.grafana.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}