{{- if .Values.grafana.enabled -}}
{{- $grafanaURL := include "lunar.grafanaURL" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar.fullname" . }}-grafana
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  {{- with .Values.grafana.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "lunar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      {{- with .Values.grafana.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
        {{- with .Values.grafana.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lunar.serviceAccountName" . }}
      {{- with .Values.grafana.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.grafana.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          {{- with .Values.grafana }}
          env:
            - name: POSTGRES_HOST
              value: {{ $.Values.hub.db.host | quote }}
            - name: POSTGRES_PORT
              value: {{ $.Values.hub.db.port | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.hub.db.user.secretName }}
                  key: {{ $.Values.hub.db.user.secretKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.hub.db.pass.secretName }}
                  key: {{ $.Values.hub.db.pass.secretKey }}
            - name: POSTGRES_DB
              value: {{ $.Values.hub.db.name | quote }}
            - name: LUNAR_HUB_HOST
              value: {{ include "lunar.hubHost" $ | quote }}
            - name: LUNAR_HUB_HTTP_PORT
              value: {{ $.Values.hub.service.ports.http | quote }}
            {{- with $grafanaURL }}
            - name: GF_SERVER_ROOT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: LUNAR_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.hubAuthSecretName" $ }}
                  key: {{ $.Values.hub.auth.secretKey }}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAdminSecretName" $ }}
                  key: {{ .admin.userKey }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAdminSecretName" $ }}
                  key: {{ .admin.passwordKey }}
            # GF_INSTALL_PLUGINS, GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS,
            # GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, GF_USERS_ALLOW_SIGN_UP,
            # GF_USERS_DEFAULT_THEME and GF_FEATURE_TOGGLES_ENABLE are baked into
            # the lunar-grafana image now (they're coupled to the plugins,
            # dashboards and theme it bundles); override via grafana.extraEnv.
            {{- with .extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- with .Values.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.grafana.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: kiosk
          image: nginx:1-alpine
          ports:
            - name: kiosk
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: kiosk-config
              mountPath: /etc/nginx/conf.d
      {{- range .Values.grafana.volumes }}
      {{- if eq .name "kiosk-config" }}
      {{- fail "Values.grafana.volumes contains reserved name 'kiosk-config'" }}
      {{- end }}
      {{- end }}
      volumes:
        - name: kiosk-config
          configMap:
            name: {{ include "lunar.fullname" . }}-grafana-kiosk
        {{- with .Values.grafana.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}