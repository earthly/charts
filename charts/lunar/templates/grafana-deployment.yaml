{{- if eq .Values.grafana.mode "chart" -}}
{{- $grafanaURL := include "lunar.grafanaURL" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lunar.fullname" . }}-grafana
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  {{- with .Values.grafana.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  selector:
    matchLabels:
      {{- include "lunar.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      {{- with .Values.grafana.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lunar.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
        {{- with .Values.grafana.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "lunar.serviceAccountName" . }}
      {{- with .Values.grafana.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.grafana.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          {{- with .Values.grafana }}
          env:
            {{- with $grafanaURL }}
            - name: GF_SERVER_ROOT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAuthSecretName" $ }}
                  key: {{ .auth.userKey }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "lunar.grafanaAuthSecretName" $ }}
                  key: {{ .auth.passwordKey }}
            # Stock upstream Grafana: plugins, datasources and dashboards are
            # installed over the API by the lunar-dashboards provisioning tool (the
            # provisioning hook Job + reconverge sidecar), not baked into the image,
            # so the only server-level knob we set is sign-up. Override via extraEnv.
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            {{- include "lunar.grafanaDBEnv" $ | nindent 12 }}
            {{- with .extraEnv }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.grafana.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.grafana.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: kiosk
          image: "{{ .Values.grafana.nginx_image.repository }}:{{ .Values.grafana.nginx_image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          {{- with .Values.grafana.kioskSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: kiosk
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: kiosk
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: kiosk
            initialDelaySeconds: 2
            periodSeconds: 5
          {{- with .Values.grafana.kioskResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: kiosk-config
              mountPath: /etc/nginx/conf.d
            # Stock nginx image writes its pidfile + proxy/temp dirs under these
            # paths at startup; both are root-owned in the image, so a non-root
            # runAsUser (kioskSecurityContext) needs them writable via emptyDir.
            - name: kiosk-cache
              mountPath: /var/cache/nginx
            - name: kiosk-run
              mountPath: /run
        # Reconverge sidecar — present in mode=chart (the only mode with a bundled
        # pod); chart mode always provisions, so it has no separate toggle.
        - name: provision-reconverge
          # Re-applies plugins/datasources/dashboards on every pod start so the
          # Grafana pod is stateless/self-healing — a recreated pod (or lost
          # volume) converges back without waiting for the next Hub upgrade.
          # deploy.sh resolves the Grafana endpoint + read-only DB connection from
          # the Hub; GRAFANA_URL points at the Grafana container in this pod.
          image: {{ include "lunar.provisioningImage" . | quote }}
          imagePullPolicy: {{ .Values.grafana.provisioning.image.pullPolicy }}
          {{- with .Values.grafana.provisioning.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Marker for the probes below, written immediately — this sidecar
              # is deliberately non-blocking (a slow/failed reconverge must not
              # hold the Deployment's pod (and thus the grafana/kiosk containers)
              # out of Ready), so readiness reflects the process being alive, not
              # deploy.sh's outcome.
              touch /tmp/reconverge-alive
              {{- include "lunar.waitForGrafana" . | nindent 14 }}
              {{- include "lunar.waitForHub" . | nindent 14 }}
              /deploy.sh || echo "dashboards reconverge failed" >&2
              # Idle so the Deployment treats this as a long-lived sidecar; it
              # re-applies on the next pod (re)start.
              tail -f /dev/null
          livenessProbe:
            exec:
              command: ["test", "-f", "/tmp/reconverge-alive"]
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/reconverge-alive"]
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: GRAFANA_URL
              value: "http://localhost:3000"
            {{- include "lunar.grafanaProvisionHubEnv" . | nindent 12 }}
          {{- with .Values.grafana.provisioning.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- range .Values.grafana.volumes }}
      {{- if or (eq .name "kiosk-config") (eq .name "kiosk-cache") (eq .name "kiosk-run") }}
      {{- fail (printf "Values.grafana.volumes contains reserved name '%s'" .name) }}
      {{- end }}
      {{- end }}
      volumes:
        - name: kiosk-config
          configMap:
            name: {{ include "lunar.fullname" . }}-grafana-kiosk
        - name: kiosk-cache
          emptyDir: {}
        - name: kiosk-run
          emptyDir: {}
        {{- with .Values.grafana.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.grafana.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.grafana.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      # Default: soft-spread Grafana replicas across zones so a single zone
      # loss doesn't take down the whole Grafana Deployment. ScheduleAnyway
      # keeps small/single-zone clusters schedulable (and is a no-op at
      # replicaCount 1). Override grafana.topologySpreadConstraints for a
      # stricter spread (e.g. a hard zone spread with DoNotSchedule).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "lunar.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: grafana
      {{- end }}
{{- end }}
