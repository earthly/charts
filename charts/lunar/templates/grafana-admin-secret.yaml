{{/*
Chart-managed Grafana admin credentials. Rendered when grafana.enabled is
true and grafana.admin.secretName is empty. Username defaults to "admin",
password is a random 32-char alphanumeric. See hub-auth-secret.yaml for
the lookup / regenerate / GitOps caveats — same pattern.
*/}}
{{- if and .Values.grafana.enabled (not .Values.grafana.admin.secretName) -}}
{{- $name := include "lunar.grafanaAdminSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $user := "admin" -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.grafana.admin.passwordKey) -}}
{{- $password = index $existing.data .Values.grafana.admin.passwordKey | b64dec -}}
{{- if index $existing.data .Values.grafana.admin.userKey -}}
{{- $user = index $existing.data .Values.grafana.admin.userKey | b64dec -}}
{{- end -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.grafana.admin.userKey }}: {{ $user | b64enc | quote }}
  {{ .Values.grafana.admin.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
