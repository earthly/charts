{{/*
Chart-managed Grafana admin credentials (basic auth) for the bundled pod.
Rendered only when grafana.mode is "chart" and grafana.auth.secretName is empty.
Username defaults to "admin", password is a random 32-char alphanumeric. See
hub-auth-secret.yaml for the lookup / regenerate / GitOps caveats — same pattern.
External mode never generates this: grafana.auth.secretName is operator-supplied
(the chart can't mint credentials for a Grafana it doesn't own).
*/}}
{{- if and (eq .Values.grafana.mode "chart") (not .Values.grafana.auth.secretName) -}}
{{- $name := include "lunar.grafanaAuthSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $user := "admin" -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data .Values.grafana.auth.passwordKey) -}}
{{- $password = index $existing.data .Values.grafana.auth.passwordKey | b64dec -}}
{{- if index $existing.data .Values.grafana.auth.userKey -}}
{{- $user = index $existing.data .Values.grafana.auth.userKey | b64dec -}}
{{- end -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ .Values.grafana.auth.userKey }}: {{ $user | b64enc | quote }}
  {{ .Values.grafana.auth.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
