{{/*
Chart-managed password for the read-only grafana_user DB role, used by the
lunar-dashboards deploy tool's Grafana datasource. Rendered when grafana +
dashboardsDeploy are enabled and no secretName is supplied. Random 32-char
alphanumeric (deploy.sh parses it out of a postgres:// URL, so it must be
alphanumeric), persisted across upgrades (helm.sh/resource-policy: keep). See
hub-auth-secret.yaml for the lookup / regenerate / GitOps caveats.
*/}}
{{- if and .Values.grafana.enabled .Values.grafana.dashboardsDeploy.enabled (not .Values.grafana.dashboardsDeploy.dbPassword.secretName) -}}
{{- $name := include "lunar.grafanaDBSecretName" . -}}
{{- $key := .Values.grafana.dashboardsDeploy.dbPassword.passwordKey -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data $key) -}}
{{- $password = index $existing.data $key | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
