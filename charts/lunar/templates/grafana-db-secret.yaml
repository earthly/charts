{{/*
Chart-managed password for the read-only grafana_user DB role, used by the
lunar-dashboards provisioning tool's Grafana datasource. Rendered when provisioning
is enabled, dbPassword.mode is generate, and no secretName is supplied. Random
32-char alphanumeric (deploy.sh parses it out of a postgres:// URL, so it must be
alphanumeric).

Generated by default because an unset password doesn't yield an empty one: it
yields a role created with NO password (NULL verifier) that can't authenticate at
all. sqlapi_user had exactly that greenfield-only bug until chart 3.19.0 gave it
the same default (sqlapi-db-secret.yaml). Don't make operator-supplied the
default here and reintroduce the trap; mode=unmanaged is the explicit opt-out for
an operator who pre-created the role.

Shipped as a pre-install/pre-upgrade hook weighted BELOW the migrate Job (-10 < -5)
so it exists before that Job creates the grafana_user role WITH this password
(02_grafana/user.sql) and before the hub Deployment reads it. resource-policy: keep
+ the lookup guard render it once and keep it stable across upgrade/uninstall.
02_grafana is re-applied in full on every migrate run, so a fresh password would
reach the role — but the datasource the provisioning tool configured would hold
the old one until it is next provisioned, and the dashboards fail in between.
See hub-auth-secret.yaml for the lookup / GitOps caveats (use mode=secret for
GitOps).
*/}}
{{- if and (ne .Values.grafana.mode "off") (eq .Values.grafana.provisioning.dbPassword.mode "generate") (not .Values.grafana.provisioning.dbPassword.secretName) -}}
{{- $name := include "lunar.grafanaDBSecretName" . -}}
{{- $key := .Values.grafana.provisioning.dbPassword.passwordKey -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
