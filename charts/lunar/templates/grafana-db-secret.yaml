{{/*
Chart-managed password for the read-only grafana_user DB role, used by the
lunar-dashboards deploy tool's Grafana datasource. Rendered when dashboardsDeploy
is enabled and no secretName is supplied. Random 32-char alphanumeric (deploy.sh
parses it out of a postgres:// URL, so it must be alphanumeric).

Shipped as a pre-install/pre-upgrade hook weighted BELOW the migrate Job (-10 < -5)
so it exists before that Job creates the grafana_user role WITH this password
(02_grafana/user.sql) and before the hub Deployment reads it. resource-policy: keep
+ the lookup guard render it once and keep it stable across upgrade/uninstall — the
password must stay in sync with the DB role (02_grafana is a content-hashed code
package that won't re-run to reset it). See hub-auth-secret.yaml for the lookup /
GitOps caveats (set dbPassword.secretName for GitOps).
*/}}
{{- if and .Values.grafana.dashboardsDeploy.enabled (not .Values.grafana.dashboardsDeploy.dbPassword.secretName) -}}
{{- $name := include "lunar.grafanaDBSecretName" . -}}
{{- $key := .Values.grafana.dashboardsDeploy.dbPassword.passwordKey -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
