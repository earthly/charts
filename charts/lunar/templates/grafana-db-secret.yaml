{{/*
Chart-managed password for the read-only grafana_user DB role, used by the
lunar-dashboards provisioning tool's Grafana datasource. Rendered when provisioning
is enabled and no secretName is supplied. Random 32-char alphanumeric (deploy.sh
parses it out of a postgres:// URL, so it must be alphanumeric).

Deliberately chart-generated, NOT operator-supplied like sqlapi_user's
HUB_SQLAPI_PASSWORD: an unset operator password doesn't yield an empty password, it
yields a role created with NO password (NULL verifier) that can't authenticate at
all — a greenfield-only footgun the migrate Job's own HUB_SQLAPI_PASSWORD comment
concedes. Generating it here (randAlphaNum 32) makes that impossible: the role
always has a usable password. grafana_user is internal (the Hub vends its
connection to the provisioning tool; never user-facing), so keep it generated —
don't "align" it back to the sqlapi operator-supplied pattern and reintroduce the trap.

Shipped as a pre-install/pre-upgrade hook weighted BELOW the migrate Job (-10 < -5)
so it exists before that Job creates the grafana_user role WITH this password
(02_grafana/user.sql) and before the hub Deployment reads it. resource-policy: keep
+ the lookup guard render it once and keep it stable across upgrade/uninstall — the
password must stay in sync with the DB role (02_grafana is a content-hashed code
package that won't re-run to reset it). See hub-auth-secret.yaml for the lookup /
GitOps caveats (set dbPassword.secretName for GitOps).
*/}}
{{- if and (ne .Values.grafana.mode "off") (not .Values.grafana.provisioning.dbPassword.secretName) -}}
{{- $name := include "lunar.grafanaDBSecretName" . -}}
{{- $key := .Values.grafana.provisioning.dbPassword.passwordKey -}}
{{- if not (lookup "v1" "Secret" .Release.Namespace $name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "lunar.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
{{- end }}
{{- end }}
