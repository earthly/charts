# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# Kubernetes cluster DNS domain. Used to render in-cluster service FQDNs
# (`<svc>.<ns>.svc.<clusterDomain>`). Default matches stock K8s. Override only
# if your cluster was provisioned with a non-default --cluster-domain (rare;
# most managed clusters — EKS, GKE, AKS — use cluster.local).
clusterDomain: cluster.local

imagePullSecrets: []

# Global logger config applied to both Hub and Operator.
# Controls local process logging (stdout/stderr).
logging:
  level: "info"
  format: "json"

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

hub:
  # External URL where GitHub posts webhooks. Hub registers
  # <webhookURL>/webhooks/github with the GitHub App at boot.
  #
  # Defaults to "https://<hub.ingress.webhooks.host>" ONLY when chart-
  # managed ingress is enabled — that's the case where the chart actually
  # routes traffic at that host. Most chart-managed installs leave this
  # empty and let the chart derive it.
  #
  # Set explicitly when:
  #   - hub.ingress.enabled is false (BYO ingress / LoadBalancer / mesh).
  #     The chart will not guess a URL it doesn't route to; if you leave
  #     this empty in BYO mode, HUB_PUBLIC_BASE_URL is empty and the hub
  #     warns at boot and skips webhook auto-registration.
  #   - You need a non-default scheme (http for dev), port, or path prefix.
  #
  # When set explicitly AND hub.ingress.enabled is true, the host portion
  # must equal hub.ingress.webhooks.host. The chart fails fast otherwise —
  # GitHub would POST into the void.
  webhookURL: ""

  # Base URL where Grafana is reachable. Used for two distinct purposes:
  #   - HUB_GRAFANA_URL_BASE — base for hub's [More Details] links in PR comments
  #   - GF_SERVER_ROOT_URL — Grafana's own self-knowledge (drives absolute
  #     link generation, OIDC redirect_uri, etc). Critical to get right when
  #     Grafana fronts third-party auth (Google, Okta, GitHub OIDC, ...).
  #
  # Defaults to https://<grafana.ingress.hosts[0].host> when chart-managed
  # Grafana ingress is enabled — most installs just turn that on and leave
  # this empty. Empty otherwise — the chart deliberately does NOT guess at
  # a Grafana URL when it doesn't control the routing (no fallback to
  # webhookURL or api.host — wrong trust boundary, wrong host).
  #
  # Set explicitly when Grafana is reachable via external routing the chart
  # doesn't manage. Required for OIDC to work in that topology.
  grafanaURLBase: ""

  rootDir: /hub/

  # Hub licence JWT secret mount. This token is authoritative for tenant and
  # telemetry routing configuration.
  licence:
    secretName: "lunar-hub-licence"
    secretKey: "hub-licence.jwt"
    filePath: "/var/run/secrets/lunar/hub-licence.jwt"

  db:
    user:
      secretName: "lunar-db"
      secretKey: "username"
    pass:
      secretName: "lunar-db"
      secretKey: "password"
    name: ""
    host: ""
    port: 5432
    waitSecs: 45
    # Extra options appended to the Postgres connection string. Defaults to
    # sslmode=require so fresh managed-Postgres installs (RDS / Aurora /
    # Cloud SQL, all of which default to forced TLS) just work. Set to
    # "sslmode=disable" for plain cluster-local Postgres without TLS.
    #
    # Format: libpq KV pairs, space-separated. NOT URL query syntax.
    #   OK:  "sslmode=require"
    #   OK:  "sslmode=require connect_timeout=10"
    #   BAD: "sslmode=require&connect_timeout=10"   # will fail to parse
    #
    # Footgun: overriding REPLACES the whole string — the default is not
    # merged in. If you pass additional options, include sslmode= yourself.
    #
    # Also consumed by the operator (OPERATOR_DB_CONNECTION_OPTIONS); both
    # components connect to the same DB so they share this value.
    connectionOptions: "sslmode=require"
  github:
    baseUrl: ""
    app:
      privateKey:
        secretName: "lunar-github-app"
        secretKey: "private-key"
      id: 0
      installId: 0
    # Webhook secret. Leave secretName empty to have the chart generate one
    # (recommended for fresh installs). The chart-managed secret persists
    # across upgrade and uninstall (helm.sh/resource-policy: keep). Retrieve:
    #   kubectl get secret <release>-github-webhook \
    #     -o jsonpath='{.data.webhook-secret}' | base64 -d
    # and register it with your GitHub App.
    #
    # GitOps users (ArgoCD/Flux): see README "GitOps note" — either set
    # secretName to a pre-managed secret, or add ignoreDifferences for
    # /data/webhook-secret in your Application spec.
    webhookSecret:
      secretName: ""
      secretKey: "webhook-secret"
    syncWindow: 2160h
  policyQueue:
    pollInterval: 1s
    numWorkers: 5

  # Worker caps for Hub's script-feeding queues. 0 means unlimited.
  maxWorkers:
    collect: 10
    policy: 20
    cronCollect: 5
    cataloger: 1
  # S3-compatible object storage for script logs and resource archives.
  # The buckets must exist and be writable by the hub's AWS credentials.
  # AWS credentials themselves are intentionally out of scope for this
  # chart — see README "Object storage & AWS credentials" for options
  # (IRSA on EKS, explicit AWS_* via hub.extraEnv, etc.).
  s3:
    # Bucket names are effectively required — empty values make every log
    # upload and every script resource fetch fail at runtime.
    logsBucket: ""
    resourcesBucket: ""
    # TTL for pre-signed URLs, as Go duration strings
    # (see https://pkg.go.dev/time#ParseDuration), e.g. "5m", "1h".
    # - logsUrlTtl: PUT URLs for script log uploads during execution.
    # - resourcesUrlTtl: GET URLs for script resource archives fetched
    #   by init containers before execution; leave generous to absorb
    #   pod scheduling / image pull / cluster backpressure.
    logsUrlTtl: 5m
    resourcesUrlTtl: 1h
  # Hub auth token. Leave secretName empty to have the chart generate one
  # (recommended for fresh installs). The chart-managed secret persists
  # across upgrade and uninstall (helm.sh/resource-policy: keep). Retrieve:
  #   kubectl get secret <release>-auth-token \
  #     -o jsonpath='{.data.token}' | base64 -d
  # and pass to CLI / CI agent installs as LUNAR_HUB_TOKEN.
  #
  # GitOps users (ArgoCD/Flux): see README "GitOps note".
  auth:
    secretName: ""
    secretKey: "token"
  # Optional per-scope runtime secrets, exposed to scripts via the hub's
  # "lunar secret set" workflow. Leave secretName empty to skip injection —
  # scripts can alternatively read secrets from envFrom / volumes declared
  # on the per-type operator.scriptContainerSpec* you control.
  #
  # Format: the referenced K8s secret's data key (default "secrets") is
  # parsed by Hub as a comma-separated list of `NAME:VALUE` pairs
  # (kelseyhightower/envconfig map format — NOT JSON). Each pair surfaces
  # in script pods as `LUNAR_SECRET_<NAME>`. See README "Script secrets
  # (optional)" section for examples.
  secrets:
    collector:
      secretName: ""
      secretKey: "secrets"
    cataloger:
      secretName: ""
      secretKey: "secrets"
    policy:
      secretName: ""
      secretKey: "secrets"

  persistence:
    enabled: true
    # Leave empty to use the cluster default StorageClass.
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  extraEnv: []

  image:
    repository: "ghcr.io/earthly/lunar-hub"
    pullPolicy: IfNotPresent
    tag: "2.1.1"

  service:
    type: ClusterIP
    ports:
      server: 8000
      http: 8001

  # Hub has two trust boundaries:
  #   1. Trusted API clients — lunar CLI, CI agents, operator. Talk to hub
  #      over gRPC (port 8000) and HTTP (port 8001, /logs only). Both use
  #      the same Hub auth token.
  #   2. GitHub webhooks — public internet. POST to /webhooks/github only.
  #
  # The chart renders separate ingresses for each so you can put the API
  # ingress on a private hostname (Tailscale, internal-DNS, VPN) and only
  # expose the webhooks ingress to the public internet.
  #
  # Disable entirely if you front the hub with a LoadBalancer Service, a
  # service mesh, or your own Ingress YAML.
  ingress:
    enabled: false

    # Shared defaults. Applied to all three rendered Ingress resources
    # unless overridden inside api.* / webhooks.* below.
    className: ""
    tls: []
    annotations: {}

    # API ingress: gRPC + /logs. Used by lunar CLI, CI agents, and the
    # operator. Renders TWO Ingress resources (api-grpc + api-http) sharing
    # one hostname — the split exists because most ingress controllers
    # apply backend-protocol annotations per-Ingress, not per-path. Safe
    # to put on a private hostname.
    api:
      # Required when ingress.enabled is true.
      host: ""

      # Optional per-ingress overrides of the shared defaults above.
      # Empty values fall back to ingress.className / ingress.tls.
      className: ""
      tls: []

      # Per-sub-Ingress annotations, layered on top of ingress.annotations.
      # NGINX users almost always need backend-protocol: "GRPC" for the gRPC
      # half. To add the same annotation to BOTH api Ingresses, either put it
      # in ingress.annotations (shared with webhooks too) or duplicate it under
      # both maps below.
      grpcAnnotations:
        nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
      httpAnnotations: {}

    # Webhooks ingress: GitHub webhook receiver only. Public-facing.
    # Lock this down to /webhooks if you want — nothing else lives here.
    # Also the source of the derived hub.webhookURL (https://<host>).
    webhooks:
      # Required when ingress.enabled is true.
      host: ""

      # Optional per-ingress overrides.
      className: ""
      tls: []
      annotations: {}

  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3

  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

operator:
  image:
    repository: "ghcr.io/earthly/lunar-snippet-operator"
    pullPolicy: IfNotPresent
    tag: "2.1.1"

  initImage:
    repository: "ghcr.io/earthly/lunar-snippet-init"
    pullPolicy: IfNotPresent
    tag: "2.1.1"

  sidecarImage:
    repository: "ghcr.io/earthly/lunar-snippet-sidecar"
    pullPolicy: IfNotPresent
    tag: "2.1.1"

  # Namespace where script pods are created. Defaults to the release namespace.
  # If set, the namespace must already exist — the chart will not create it.
  scriptNamespace: ""

  # Hostname the operator (and the script pods it spawns) uses to reach Hub
  # gRPC. Empty = chart computes the in-cluster FQDN
  # `<release>-hub.<release-namespace>.svc.<clusterDomain>`, which resolves
  # from any namespace and is the right answer for ~all installs (including
  # cross-namespace `scriptNamespace`). Override only for service-mesh /
  # split-DNS / multi-cluster topologies where Hub is reachable at a
  # non-standard name.
  hubHost: ""

  maxConcurrent: 10
  healthPort: 8081

  # Per-script-type base container spec. The operator overlays required
  # fields (name, image, command, workingDir, volume mounts) on top — you
  # control everything else: resources, env, envFrom, securityContext, etc.
  #
  # Types with no override use the operator's built-in default. Override per
  # type to match each workload's profile:
  #   - policy:    runs tiny Python scripts against JSON; request small
  #                resources for dense packing.
  #   - collector: may clone repos and call external APIs; give it headroom.
  #   - cataloger: similar to collector but typically lighter.
  #
  # Example:
  #   scriptContainerSpecPolicy:
  #     resources:
  #       requests:
  #         cpu: "50m"
  #         memory: "128Mi"
  #       limits:
  #         cpu: "500m"
  #         memory: "256Mi"
  scriptContainerSpecPolicy: {}
  scriptContainerSpecCollector: {}
  scriptContainerSpecCataloger: {}

  # Per-script-type batch size: how many jobs the operator groups into a
  # single pod. Zero = use the operator's built-in default. Policies are cheap
  # and uniform — pack more per pod to amortize init+sidecar overhead.
  # Collectors have higher runtime variance, so smaller batches limit blast
  # radius of slow jobs.
  # Example:
  #   batchMaxCountPolicy: 50
  batchMaxCountPolicy: 0
  batchMaxCountCollector: 0
  batchMaxCountCataloger: 0

  # Pod-level scheduling for script pods. Applied to every pod the operator creates.
  # Example:
  #   scriptPodNodeSelector:
  #     tenant: cronos
  #   scriptPodTolerations:
  #     - key: tenant
  #       value: cronos
  #       effect: NoSchedule
  scriptPodNodeSelector: {}
  scriptPodTolerations: []

  extraEnv: []
  resources: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

grafana:
  enabled: true

  # Admin credentials. Leave secretName empty to have the chart generate them
  # (recommended for fresh installs): username defaults to "admin", password
  # is a 32-char alphanumeric. The chart-managed secret persists across
  # upgrade and uninstall (helm.sh/resource-policy: keep). Retrieve:
  #   kubectl get secret <release>-grafana-admin \
  #     -o jsonpath='{.data.password}' | base64 -d
  #
  # GitOps users (ArgoCD/Flux): see README "GitOps note".
  admin:
    secretName: ""
    userKey: "username"
    passwordKey: "password"

  extraEnv: []

  image:
    repository: "ghcr.io/earthly/lunar-grafana"
    pullPolicy: IfNotPresent
    tag: "2.1.1"

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
