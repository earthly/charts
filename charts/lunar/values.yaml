# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  automount: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

hub:
  # External URL where the hub is reachable (e.g. https://cronos.demo.earthly.dev).
  # Used by the hub for webhook callbacks and by Grafana for dashboard log links.
  publicBaseURL: ""

  rootDir: /hub/

  db:
    user:
      secretName: "lunar-db"
      secretKey: "username"
    pass:
      secretName: "lunar-db"
      secretKey: "password"
    name: ""
    host: ""
    port: 5432
    waitSecs: 45
  github:
    baseUrl: ""
    app:
      privateKey:
        secretName: "lunar-github-app"
        secretKey: "private-key"
      id: 0
      installId: 0
    webhookSecret:
      secretName: "lunar-github-webhook"
      secretKey: "webhook-secret"
    syncWindow: 2160h
  policyQueue:
    pollInterval: 1s
    numWorkers: 5
  # S3-compatible object storage for snippet logs and resource archives.
  # The buckets must exist and be writable by the hub's AWS credentials.
  # AWS credentials themselves are intentionally out of scope for this
  # chart — see README "Object storage & AWS credentials" for options
  # (IRSA on EKS, explicit AWS_* via hub.extraEnv, etc.).
  s3:
    # Bucket names are effectively required — empty values make every log
    # upload and every snippet resource fetch fail at runtime.
    logsBucket: ""
    resourcesBucket: ""
    # TTL for pre-signed URLs, as Go duration strings
    # (see https://pkg.go.dev/time#ParseDuration), e.g. "5m", "1h".
    # - logsUrlTtl: PUT URLs for snippet log uploads during execution.
    # - resourcesUrlTtl: GET URLs for snippet resource archives fetched
    #   by init containers before execution; leave generous to absorb
    #   pod scheduling / image pull / cluster backpressure.
    logsUrlTtl: 5m
    resourcesUrlTtl: 1h
  auth:
    secretName: "lunar-auth-token"
    secretKey: "token"
  # Optional per-scope runtime secrets, exposed to snippets via the hub's
  # "lunar secret set" workflow. Leave secretName empty to skip injection —
  # snippets can alternatively read secrets from envFrom / volumes declared
  # on the per-type operator.snippetContainerSpec* you control.
  secrets:
    collector:
      secretName: ""
      secretKey: "secrets"
    cataloger:
      secretName: ""
      secretKey: "secrets"
    policy:
      secretName: ""
      secretKey: "secrets"
  logging:
    tenantId: "localdev"
    level: "info"
    format: "json"
    elastic:
      url: "" 
      apiKeySecret:
        secretName: "lunar-elastic-api-key"
        secretKey: "api-key"
      bufferSize: 100
      flushInterval: "5s"

  persistence:
    enabled: true
    # Leave empty to use the cluster default StorageClass.
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  extraEnv: []

  image:
    repository: "earthly/lunar-hub"
    pullPolicy: IfNotPresent
    tag: "main"

  service:
    type: ClusterIP
    ports:
      server: 8000
      http: 8001

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3

  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

operator:
  image:
    repository: "earthly/lunar-snippet-operator"
    pullPolicy: IfNotPresent
    tag: "main"

  initImage:
    repository: "earthly/lunar-snippet-init"
    pullPolicy: IfNotPresent
    tag: "main"

  sidecarImage:
    repository: "earthly/lunar-snippet-sidecar"
    pullPolicy: IfNotPresent
    tag: "main"

  # Namespace where snippet pods are created. Defaults to the release namespace.
  # If set, the namespace must already exist — the chart will not create it.
  snippetNamespace: ""
  maxConcurrent: 10
  healthPort: 8081

  logging:
    tenantId: "localdev"
    level: "info"
    format: "json"
    elastic:
      url: ""
      apiKeySecret:
        secretName: "lunar-elastic-api-key"
        secretKey: "api-key"
      bufferSize: 100
      flushInterval: "5s"

  # Per-snippet-type base container spec. The operator overlays required
  # fields (name, image, command, workingDir, volume mounts) on top — you
  # control everything else: resources, env, envFrom, securityContext, etc.
  #
  # Types with no override use the operator's built-in default. Override per
  # type to match each workload's profile:
  #   - policy:    runs tiny Python scripts against JSON; request small
  #                resources for dense packing.
  #   - collector: may clone repos and call external APIs; give it headroom.
  #   - cataloger: similar to collector but typically lighter.
  #
  # Example:
  #   snippetContainerSpecPolicy:
  #     resources:
  #       requests:
  #         cpu: "50m"
  #         memory: "128Mi"
  #       limits:
  #         cpu: "500m"
  #         memory: "256Mi"
  snippetContainerSpecPolicy: {}
  snippetContainerSpecCollector: {}
  snippetContainerSpecCataloger: {}

  # Per-snippet-type batch size: how many jobs the operator groups into a
  # single pod. Zero = use the operator's built-in default. Policies are cheap
  # and uniform — pack more per pod to amortize init+sidecar overhead.
  # Collectors have higher runtime variance, so smaller batches limit blast
  # radius of slow jobs.
  # Example:
  #   batchMaxCountPolicy: 50
  batchMaxCountPolicy: 0
  batchMaxCountCollector: 0
  batchMaxCountCataloger: 0

  # Pod-level scheduling for snippet pods. Applied to every pod the operator creates.
  # Example:
  #   snippetPodNodeSelector:
  #     tenant: cronos
  #   snippetPodTolerations:
  #     - key: tenant
  #       value: cronos
  #       effect: NoSchedule
  snippetPodNodeSelector: {}
  snippetPodTolerations: []

  extraEnv: []
  resources: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

grafana:
  enabled: false

  admin:
    user:
      secretName: "lunar-grafana-admin"
      secretKey: "username"
    password:
      secretName: "lunar-grafana-admin"
      secretKey: "password"

  extraEnv: []

  image:
    repository: "earthly/lunar-grafana"
    pullPolicy: IfNotPresent
    tag: "main"

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []

  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}