# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""
# Kubernetes cluster DNS domain. Used to render in-cluster service FQDNs
# (`<svc>.<ns>.svc.<clusterDomain>`). Default matches stock K8s. Override only
# if your cluster was provisioned with a non-default --cluster-domain (rare;
# most managed clusters — EKS, GKE, AKS — use cluster.local).
clusterDomain: cluster.local
imagePullSecrets: []
# Global logger config applied to both Hub and Operator.
# Controls local process logging (stdout/stderr).
logging:
  level: "info"
  format: "json"
serviceAccount:
  create: true
  automount: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
hub:
  # External URL where GitHub posts webhooks. Hub registers
  # <webhookURL>/webhooks/github with the GitHub App at boot.
  #
  # Defaults to "https://<hub.ingress.webhooks.host>" ONLY when chart-
  # managed ingress is enabled — that's the case where the chart actually
  # routes traffic at that host. Most chart-managed installs leave this
  # empty and let the chart derive it.
  #
  # Set explicitly when:
  #   - hub.ingress.enabled is false (BYO ingress / LoadBalancer / mesh).
  #     The chart will not guess a URL it doesn't route to; if you leave
  #     this empty in BYO mode, HUB_PUBLIC_BASE_URL is empty and the hub
  #     warns at boot and skips webhook auto-registration.
  #   - You need a non-default scheme (http for dev), port, or path prefix.
  #
  # When set explicitly AND hub.ingress.enabled is true, the host portion
  # must equal hub.ingress.webhooks.host. The chart fails fast otherwise —
  # GitHub would POST into the void.
  webhookURL: ""
  # Number of hub replicas. The hub is stateless (state lives in Postgres and
  # S3), so HA (multi-replica) is the recommended default. N=2 tolerates losing
  # one pod; scale to 3 for more headroom. Set 1 for a minimal single-instance
  # install (a config-only fallback — no schema/state change either way). NOTE:
  # total Postgres connections scale with replicaCount — see db.maxPoolConns
  # below and size max_connections accordingly. See the HA operations runbook.
  replicaCount: 2
  # Grace period for the hub to drain on SIGTERM; must be >= preStopSleepSeconds
  # plus the hub's shutdown budget (HUB_SHUTDOWN_TIMEOUT, default 45s).
  terminationGracePeriodSeconds: 60
  # Seconds the container sleeps in its preStop hook, before SIGTERM, giving k8s
  # time to deregister this pod from the Service so new requests stop arriving
  # before the hub drains (graceful shutdown, R4). Set 0 to disable.
  preStopSleepSeconds: 10
  # PodDisruptionBudget for the hub. On by default to match the multi-replica
  # default — it keeps a replica serving during voluntary node drains. Disable
  # it if you set replicaCount: 1, since a PDB on a single replica can block
  # voluntary node drains. Set exactly one of maxUnavailable / minAvailable —
  # the chart fails fast at render time if both are set (the API server rejects
  # a PDB with both).
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
    # minAvailable: 1
  # Extra pod topology-spread constraints for hub replicas. Empty is NOT
  # "no spread" — the chart applies a soft default (maxSkew 1 across
  # kubernetes.io/hostname, ScheduleAnyway) so multi-replica deploys survive a
  # node loss out of the box. Set this to override with your own (e.g. a hard
  # zone spread); it replaces the default wholesale.
  topologySpreadConstraints: []
  # Hub licence JWT secret mount. This token is authoritative for tenant and
  # telemetry routing configuration.
  licence:
    secretName: "lunar-hub-licence"
    secretKey: "hub-licence.jwt"
    filePath: "/var/run/secrets/lunar/hub-licence.jwt"
  db:
    user:
      secretName: "lunar-db"
      secretKey: "username"
    pass:
      secretName: "lunar-db"
      secretKey: "password"
    name: ""
    host: ""
    port: 5432
    waitSecs: 45
    # How Lunar itself reaches Postgres — the hub, the migrate Job and the
    # operator. A map of Postgres connection parameters; the chart renders it
    # into the syntax each consumer expects, so you never write a separator.
    #
    # Defaults to sslmode=require so fresh managed-Postgres installs (RDS /
    # Aurora / Cloud SQL, all of which default to forced TLS) just work. Use
    # "sslmode: disable" for plain cluster-local Postgres without TLS.
    #
    # Footgun: overriding REPLACES the whole map — the default is not merged
    # in. If you add options, keep sslmode:
    #   connectionOptions:
    #     sslmode: require
    #     connect_timeout: 10
    #
    # DEPRECATED: a plain string ("sslmode=require") is still accepted and
    # reaches every consumer verbatim, exactly as in chart 3.15.0 and earlier.
    # Removed in 4.0.0. A string carrying more than one option is wrong for at
    # least one consumer, because they do not all separate options the same
    # way — the install notes say so at upgrade time. A map is always right.
    connectionOptions:
      sslmode: require
    # What the hub hands to SQL API clients (the string surfaced by
    # `lunar sql`). Empty inherits connectionOptions above, which is what
    # every install wants until SQL API clients reach Postgres by a different
    # route than the hub does — for example through a connection pooler on a
    # hostname of its own, which clients should verify:
    #   sqlapiConnectionOptions:
    #     sslmode: verify-full
    #     sslrootcert: system
    # (sslrootcert: system needs libpq >= 16; older clients need an explicit
    # CA path instead.)
    #
    # Same map-or-string rule as connectionOptions.
    sqlapiConnectionOptions: {}
    # Per-replica Postgres connection budget. Total connections to Postgres ≈
    # replicaCount × (maxOpenConns + maxPoolConns + operatorPoolSize).
    #
    # Defaults (40/40/5 ≈ 85/replica) match the hub's built-in values. With the
    # default replicaCount: 2 that is a ceiling of ~170 connections, so size your
    # Postgres max_connections >= replicaCount × 85 plus headroom for the migrate
    # Job, psql, and superuser-reserved slots (~200 for the N=2 default, ~270 for
    # N=3). Managed Postgres (RDS/Aurora/Cloud SQL) sizes well above this by
    # default; a bare Postgres at max_connections=100 must be raised for HA.
    #
    # Do NOT lower maxPoolConns below your peak concurrent River workers (the sum
    # of hub.maxWorkers.*, currently 36) — the pgxpool is shared by every queue
    # plus the pgx stores, so a smaller pool serializes store queries under load
    # (pgxpool queues acquisition; it won't deadlock). To shrink the per-replica
    # budget, reduce maxWorkers.* first, then maxPoolConns to match. A connection
    # pooler helps only at large N — and a transaction-mode pooler breaks the
    # hub's session advisory locks and LISTEN/NOTIFY, so it must not front them
    # (use a direct connection for those). See the HA runbook.
    maxOpenConns: 40 # HUB_DB_MAX_OPEN_CONNS (database/sql store handle)
    maxPoolConns: 40 # HUB_DB_MAX_POOL_CONNS (pgxpool, shared by River)
    operatorPoolSize: 5 # HUB_MAX_OPERATOR_POOL_SIZE (operator_queue pool)
  github:
    baseUrl: ""
    # Single-App config. Use this for single-tenant deployments where the
    # Hub fronts one GitHub App installed in one org. Mutually exclusive
    # with hub.github.apps below.
    app:
      # owner: the GitHub org (or user) the App is installed on. Required
      # in single-App mode — the Hub uses this to route every webhook
      # through the configured installation. Operators upgrading from
      # chart < 2.2.0 must set this; previously the field was implicit.
      owner: ""
      privateKey:
        secretName: "lunar-github-app"
        secretKey: "private-key"
      id: 0
      installId: 0
    # Multi-App config. Use this when the Hub serves multiple orgs that
    # each install their own Lunar App. Each entry pins one repository
    # owner to a distinct (appId, installId) tuple, and the PEM files for
    # all entries live in a single Kubernetes Secret referenced by
    # appsSecret below. Mutually exclusive with the single-App fields
    # above.
    #
    # Example:
    #   apps:
    #     - owner: earthly
    #       appId: 123
    #       installId: 100
    #     # A GitHub Enterprise Server org: set host + baseUrl so the Hub
    #     # keys its components by that host and calls its API there. Omit
    #     # both for github.com / GHEC orgs (they default to github.com).
    #     - owner: acme-ghes
    #       host: ghes.acme.com
    #       baseUrl: https://ghes.acme.com/api/v3
    #       appId: 456
    #       installId: 200
    #
    # Per-entry fields:
    #   owner      (required) repository owner the App is installed on.
    #   appId      (required) GitHub App ID.
    #   installId  (required) installation ID for this owner.
    #   host       (optional) SCM host for this entry; defaults to
    #              github.com. Set to the GHES hostname (e.g. ghes.acme.com)
    #              so components are keyed (host, owner, name) and webhooks
    #              route to the right host.
    #   baseUrl    (optional) GitHub API base URL for this entry; defaults
    #              to the github.com API. Set to the GHES API endpoint (e.g.
    #              https://ghes.acme.com/api/v3). A GHES entry needs both
    #              host and baseUrl.
    #   privateKeyFile (optional) data key in appsSecret holding this entry's
    #              PEM; defaults to "<lowercase owner>.pem". Set it to give
    #              one owner more than one App (see below), or to separate
    #              the keys when one owner name exists on two hosts.
    #
    # Adding REST capacity for a busy org (requires Hub 3.14.0 or newer --
    # earlier Hubs reject a repeated owner at boot with "duplicate GitHub
    # App for owner"): GitHub's rate limit applies per App *installation*,
    # so installing a second App on the same org gives the Hub a second,
    # independent budget. List it as another entry with the same owner and
    # its own appId/installId, and give each entry a distinct
    # privateKeyFile (two entries for one owner would otherwise derive the
    # same PEM filename):
    #
    #   apps:
    #     - owner: earthly
    #       appId: 123
    #       installId: 100
    #     - owner: earthly
    #       appId: 789
    #       installId: 300
    #       privateKeyFile: earthly-2.pem
    #
    # The Hub spreads read traffic evenly across every App listed for an
    # owner. Writes — commit statuses and PR comments — always use the
    # first entry for that owner, because GitHub only lets the App that
    # created a check run or comment update it.
    #
    # The chart looks up each entry's PEM at
    # <appsSecret.secretName>/<lowercase-owner>.pem, mounted at
    # /secrets/github-apps inside the hub container.
    apps: []
    # Operator-created Secret holding one PEM key per entry above. Each
    # entry expects a data key named "<lowercase owner>.pem", or whatever
    # its privateKeyFile overrides that to. The chart does not generate
    # this Secret — create it with kubectl, e.g.:
    #
    #   kubectl create secret generic lunar-github-apps \
    #     --from-file=earthly.pem=./earthly.pem \
    #     --from-file=acme.pem=./acme.pem
    appsSecret:
      secretName: "lunar-github-apps"
    # Webhook secret. Leave secretName empty to have the chart generate one
    # (recommended for fresh installs). The chart-managed secret persists
    # across upgrade and uninstall (helm.sh/resource-policy: keep). Retrieve:
    #   kubectl get secret <release>-github-webhook \
    #     -o jsonpath='{.data.webhook-secret}' | base64 -d
    # and register it with your GitHub App.
    #
    # GitOps users (ArgoCD/Flux): see README "GitOps note" — either set
    # secretName to a pre-managed secret, or add ignoreDifferences for
    # /data/webhook-secret in your Application spec.
    webhookSecret:
      secretName: ""
      secretKey: "webhook-secret"
    syncWindow: 2160h
  # GitLab authentication. May be combined with hub.github (mixed-forge) or
  # used alone — at least one forge must be configured.
  gitlab:
    # One entry per top-level group the Hub should serve. Identity only —
    # the tokens themselves live in tokensSecret below.
    #   group:   the top-level group PATH (URL segment, not display name);
    #            lowercased. Also serves subgroups by longest-prefix match.
    #   host:    optional; instance hostname for self-managed / GitLab
    #            Dedicated (defaults to gitlab.com). Self-managed hosts MUST
    #            be declared or the Hub treats them as GitHub.
    #   baseUrl: optional; API endpoint override (advanced).
    #   webhookSecret: optional per-entry signing-secret override (advanced;
    #            multi-instance isolation). NOTE: this rides inline in
    #            rendered values — most installs should leave it unset and
    #            use hub.gitlab.webhookSecret below instead.
    tokens: []
    # Operator-created Secret holding one group access token per entry
    # above, under a data key named "<lowercase group>.token". The chart
    # does not generate this Secret — create it with kubectl, e.g.:
    #
    #   kubectl create secret generic lunar-gitlab-token \
    #     --from-file=acme.token=./acme.token
    tokensSecret:
      secretName: "lunar-gitlab-token"
    # Webhook signing secret (HUB_GITLAB_WEBHOOK_SECRET). Leave secretName
    # empty to have the chart generate one (recommended; persists across
    # upgrade and uninstall via helm.sh/resource-policy: keep). Unlike
    # GitHub there is nothing to paste anywhere: the Hub registers project
    # hooks itself and stamps this secret on them. GitOps users: see the
    # README "GitOps note" — same caveats as hub.github.webhookSecret.
    webhookSecret:
      secretName: ""
      secretKey: "webhook-secret"
  policyQueue:
    pollInterval: 1s
    numWorkers: 5
  # Worker caps for Hub's script-feeding queues. 0 means unlimited.
  maxWorkers:
    collect: 10
    policy: 20
    cronCollect: 5
    cataloger: 1
  # gRPC server connection-age limits (Go duration strings). Bounding a
  # connection's lifetime makes long-lived HTTP/2 clients periodically
  # reconnect, so they rebalance across hub replicas — and drop off a
  # draining replica during a rollout — instead of pinning to whichever
  # replica they first reached. maxConnectionAgeGrace is the window in which
  # in-flight RPCs finish after the age-GOAWAY before the connection is
  # force-closed. Nearly all hub RPCs are short unary calls; the one long
  # server-stream (PullManifest, held open by a 30s heartbeat during cataloger
  # waits, so it can outlast any idle timeout) is only ever invoked by the
  # one-shot `lunar` CLI on a freshly-dialed connection — age starts at 0, so it
  # gets the full age+grace runway and cycling never cuts it mid-flight. Set
  # both to 0 to disable cycling (a single-instance hub needs none).
  grpc:
    maxConnectionAge: 30m
    maxConnectionAgeGrace: 10m
  # S3-compatible object storage for script logs and resource archives.
  # The buckets must exist and be writable by the hub's AWS credentials.
  # AWS credentials themselves are intentionally out of scope for this
  # chart — see README "Object storage & AWS credentials" for options
  # (IRSA on EKS, explicit AWS_* via hub.extraEnv, etc.).
  s3:
    # Bucket names are effectively required — empty values make every log
    # upload and every script resource fetch fail at runtime.
    logsBucket: ""
    resourcesBucket: ""
    # TTL for pre-signed URLs, as Go duration strings
    # (see https://pkg.go.dev/time#ParseDuration), e.g. "5m", "1h".
    # - logsUrlTtl: PUT URLs for script log uploads during execution.
    # - resourcesUrlTtl: GET URLs for script resource archives fetched
    #   by init containers before execution; leave generous to absorb
    #   pod scheduling / image pull / cluster backpressure.
    logsUrlTtl: 5m
    resourcesUrlTtl: 1h
  # Hub auth token. Leave secretName empty to have the chart generate one
  # (recommended for fresh installs). The chart-managed secret persists
  # across upgrade and uninstall (helm.sh/resource-policy: keep). Retrieve:
  #   kubectl get secret <release>-auth-token \
  #     -o jsonpath='{.data.token}' | base64 -d
  # and pass to CLI / CI agent installs as LUNAR_HUB_TOKEN.
  #
  # GitOps users (ArgoCD/Flux): see README "GitOps note".
  auth:
    secretName: ""
    secretKey: "token"
  # Optional per-scope runtime secrets, exposed to scripts via the hub's
  # "lunar secret set" workflow. Leave secretName empty to skip injection —
  # scripts can alternatively read secrets from envFrom / volumes declared
  # on the per-type operator.scriptContainerSpec* you control.
  #
  # Two delivery shapes are supported:
  #
  # 1. Single key (default, perKey: false): the secret's `secretKey` data
  #    entry is parsed by Hub as a comma-separated list of `NAME:VALUE`
  #    pairs (kelseyhightower/envconfig map format — NOT JSON). One env
  #    var, `HUB_<SCOPE>_SECRETS`, holds the whole list.
  #
  # 2. Per-key (perKey: true): every data key in the K8s Secret is mounted
  #    via `envFrom: secretRef + prefix:` and surfaces in Hub as
  #    `HUB_<SCOPE>_SECRET_<KEY>=<value>`. Operators can rotate or add a
  #    single key without re-supplying the rest. Hub merges both shapes;
  #    per-key entries win on conflict. Requires hub >= 2.2.0.
  #
  # In either case, each pair surfaces in script pods as
  # `LUNAR_SECRET_<NAME>`. See README "Script secrets (optional)" section
  # for examples and a migration walkthrough.
  secrets:
    collector:
      secretName: ""
      secretKey: "secrets"
      perKey: false
    cataloger:
      secretName: ""
      secretKey: "secrets"
      perKey: false
    policy:
      secretName: ""
      secretKey: "secrets"
      perKey: false
  # Ephemeral scratch mounted at /var/lib/lunar (re-extracted runtimes + a
  # rebuildable snippet-code cache). No durable state lives here — snippet code
  # is served from S3 — so it is an emptyDir, not a PVC. sizeLimit caps it.
  stateDir:
    sizeLimit: 2Gi
  extraEnv: []
  image:
    repository: "ghcr.io/earthly/lunar-hub"
    pullPolicy: IfNotPresent
    tag: "3.13.2"
  service:
    type: ClusterIP
    ports:
      server: 8000
      http: 8001
  # Hub has two trust boundaries:
  #   1. Trusted API clients — lunar CLI, CI agents, operator. Talk to hub
  #      over gRPC (port 8000) and HTTP (port 8001, /logs only). Both use
  #      the same Hub auth token.
  #   2. GitHub webhooks — public internet. POST to /webhooks/github only.
  #
  # The chart renders separate ingresses for each so you can put the API
  # ingress on a private hostname (Tailscale, internal-DNS, VPN) and only
  # expose the webhooks ingress to the public internet.
  #
  # Disable entirely if you front the hub with a LoadBalancer Service, a
  # service mesh, or your own Ingress YAML.
  ingress:
    enabled: false
    # Shared defaults. Applied to all three rendered Ingress resources
    # unless overridden inside api.* / webhooks.* below.
    className: ""
    tls: []
    annotations: {}
    # API ingress: gRPC + /logs. Used by lunar CLI, CI agents, and the
    # operator. Renders TWO Ingress resources (api-grpc + api-http) sharing
    # one hostname — the split exists because most ingress controllers
    # apply backend-protocol annotations per-Ingress, not per-path. Safe
    # to put on a private hostname.
    #
    # Annotation API: webhooks.annotations is a single map (one Ingress);
    # api has split grpcAnnotations + httpAnnotations because the two API
    # Ingresses typically need different controller hints. There's no
    # api.annotations layer — annotations that apply to both api Ingresses
    # but not webhooks go in BOTH maps below (slight duplication, simpler
    # contract). Annotations that apply to ALL three Ingresses go in the
    # shared ingress.annotations above.
    api:
      # Required when ingress.enabled is true.
      host: ""
      # Optional per-ingress overrides of the shared defaults above. Note
      # the asymmetry: per-block tls/className are matched against the
      # shared defaults via Helm's `default` — empty list/string falls
      # back to shared, so there's no way to say "I want NO TLS on this
      # block when shared TLS is set." If you need per-block TLS, set it
      # only on the block(s) that should have it (leave others as []).
      className: ""
      tls: []
      # Per-sub-Ingress annotations, layered on top of ingress.annotations.
      # NGINX users need backend-protocol: "GRPC" for the gRPC half; other
      # controllers have their own equivalent (ALB: backend-protocol-version:
      # GRPC; Traefik: scheme h2c per-service; etc). Chart ships {} as
      # default to stay controller-neutral — set the appropriate value for
      # your ingress class. See README "Ingress" for examples.
      grpcAnnotations: {}
      httpAnnotations: {}
    # Webhooks ingress: GitHub webhook receiver only. Public-facing.
    # Lock this down to /webhooks if you want — nothing else lives here.
    # Also the source of the derived hub.webhookURL (https://<host>).
    webhooks:
      # Required when ingress.enabled is true.
      host: ""
      # Optional per-ingress overrides. Same fall-back-to-shared
      # behavior as api.* above.
      className: ""
      tls: []
      annotations: {}
  readinessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 1
  livenessProbe:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3
  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  # CPU/memory requests and limits for the pre-install/pre-upgrade migrate
  # Job's container. Separate from hub.resources (the long-running
  # Deployment) since a one-shot migration typically needs less headroom.
  migrateJobResources: {}
  # Backstop that reaps a wedged migrate Job — not a budget for how long
  # migrations may take. It exists because the migrator's advisory lock waits
  # forever: if another session holds it, the pod would otherwise never exit.
  #
  # How long you WAIT on an upgrade is your Helm timeout (helm --timeout, or
  # the helm_release timeout in Terraform), not this. Keep this comfortably
  # ABOVE that. When the two are equal the Job dies at the exact moment Helm
  # gives up, so a slow-but-healthy migration can never finish in the
  # background and make the retry a no-op — and a CREATE INDEX CONCURRENTLY
  # killed midway leaves an invalid index behind.
  migrateJobActiveDeadlineSeconds: 3600
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
operator:
  # Number of operator replicas. Safe at N>1 on the leader-elected image (>= the
  # release that adds operator Manager leader election): snippet execution stays
  # active-active (River workers), while exactly one replica runs the pod-GC
  # reconciler via the leader-election Lease (RBAC in operator-rbac.yaml). On a
  # pre-LE image, N>1 is still safe but runs N duplicate (idempotent) GC passes.
  # Operator Postgres connections scale with replicaCount. Keep at 1 unless you
  # want operator failover / throughput.
  replicaCount: 1
  # Grace period for the operator to drain on SIGTERM; must exceed
  # OPERATOR_SHUTDOWN_TIMEOUT (default 90s) with room for the process to exit.
  #
  # While draining, the operator requeues each in-flight snippet batch and
  # deletes its pod, so the time required scales with maxConcurrent below. If
  # you raise maxConcurrent, raise this and OPERATOR_SHUTDOWN_TIMEOUT with it:
  # too short a window leaves in-flight jobs claimed until the queue rescuer
  # reclaims them, delaying that work.
  terminationGracePeriodSeconds: 120
  image:
    repository: "ghcr.io/earthly/lunar-snippet-operator"
    pullPolicy: IfNotPresent
    tag: "3.13.2"
  initImage:
    repository: "ghcr.io/earthly/lunar-snippet-init"
    pullPolicy: IfNotPresent
    tag: "3.13.2"
  sidecarImage:
    repository: "ghcr.io/earthly/lunar-snippet-sidecar"
    pullPolicy: IfNotPresent
    tag: "3.13.2"
  # Namespace where script pods are created. Defaults to the release namespace.
  # If set, the namespace must already exist — the chart will not create it.
  scriptNamespace: ""
  # Hostname the operator (and the script pods it spawns) uses to reach Hub
  # gRPC. Empty = chart computes the in-cluster FQDN
  # `<release>-hub.<release-namespace>.svc.<clusterDomain>`, which resolves
  # from any namespace and is the right answer for ~all installs (including
  # cross-namespace `scriptNamespace`). Override only for service-mesh /
  # split-DNS / multi-cluster topologies where Hub is reachable at a
  # non-standard name.
  hubHost: ""
  maxConcurrent: 10
  healthPort: 8081
  # Per-script-type base container spec. The operator overlays required
  # fields (name, image, command, workingDir, volume mounts) on top — you
  # control everything else: resources, env, envFrom, securityContext, etc.
  #
  # Types with no override use the operator's built-in default. Override per
  # type to match each workload's profile:
  #   - policy:    runs tiny Python scripts against JSON; request small
  #                resources for dense packing.
  #   - collector: may clone repos and call external APIs; give it headroom.
  #   - cataloger: similar to collector but typically lighter.
  #
  # Example:
  #   scriptContainerSpecPolicy:
  #     resources:
  #       requests:
  #         cpu: "50m"
  #         memory: "128Mi"
  #       limits:
  #         cpu: "500m"
  #         memory: "256Mi"
  scriptContainerSpecPolicy: {}
  scriptContainerSpecCollector: {}
  scriptContainerSpecCataloger: {}
  # Container spec for the operator-injected init and sidecar containers (one of
  # each per script pod, the same across all script types). Same overlay rules
  # as scriptContainerSpec* above — you control resources, env, etc.; the
  # operator overlays image, env, and volume mounts. Set resources here so the
  # init and sidecar containers satisfy a namespace ResourceQuota / LimitRange
  # that requires requests. Empty ({}) uses the operator's built-in defaults
  # (init sized for the git clone, sidecar minimal). The init/sidecar
  # container-level securityContext follows the script container's; it is not
  # set here.
  # Example:
  #   scriptInitContainerSpec:
  #     resources:
  #       requests:
  #         cpu: "100m"
  #         memory: "128Mi"
  #       limits:
  #         cpu: "500m"
  #         memory: "512Mi"
  scriptInitContainerSpec: {}
  scriptSidecarContainerSpec: {}
  # Per-script-type batch size: how many jobs the operator groups into a
  # single pod. Zero = use the operator's built-in default. Policies are cheap
  # and uniform — pack more per pod to amortize init+sidecar overhead.
  # Collectors have higher runtime variance, so smaller batches limit blast
  # radius of slow jobs.
  # Example:
  #   batchMaxCountPolicy: 50
  batchMaxCountPolicy: 0
  batchMaxCountCollector: 0
  batchMaxCountCataloger: 0
  # Pod-level scheduling for script pods. Applied to every pod the operator creates.
  # Example:
  #   scriptPodNodeSelector:
  #     tenant: cronos
  #   scriptPodTolerations:
  #     - key: tenant
  #       value: cronos
  #       effect: NoSchedule
  scriptPodNodeSelector: {}
  scriptPodTolerations: []
  # PriorityClass name applied to every script pod the operator creates. Empty
  # leaves priorityClassName unset, so pods get the cluster's default priority.
  # The referenced PriorityClass must already exist in the cluster.
  # Example:
  #   scriptPodPriorityClassName: lunar-snippet
  scriptPodPriorityClassName: ""
  # Pod-level annotations and securityContext applied to every script pod the
  # operator creates. NOTE: distinct from operator.podAnnotations /
  # operator.podSecurityContext below, which apply to the operator's OWN
  # Deployment pod — not the script pods. scriptPodSecurityContext is the
  # pod-scoped context (fsGroup, runAsUser, seccompProfile, ...); set the
  # container-level securityContext via scriptContainerSpec* above.
  # Example:
  #   scriptPodAnnotations:
  #     karpenter.sh/do-not-disrupt: "true"
  #   scriptPodSecurityContext:
  #     runAsNonRoot: true
  #     fsGroup: 2000
  #     seccompProfile:
  #       type: RuntimeDefault
  scriptPodAnnotations: {}
  scriptPodSecurityContext: {}
  # Topology-spread constraints applied to every script pod the operator
  # creates. NOTE: distinct from operator.topologySpreadConstraints below, which
  # spreads the operator's OWN Deployment replicas — not the script pods.
  #
  # Prefer whenUnsatisfiable: ScheduleAnyway. Script pods are ephemeral,
  # high-churn and single-shot: with DoNotSchedule, a cluster that cannot
  # satisfy the constraint leaves them Pending until the operator times them out
  # (OPERATOR_PENDING_POD_TIMEOUT, 10m by default) and script throughput
  # silently drops.
  #
  # labelSelector is optional — when omitted, the operator selects its own
  # script pods (app.kubernetes.io/managed-by: lunar-snippet-operator). Set it
  # explicitly only to narrow the spread, e.g. to one script type via
  # lunar.earthly.dev/snippet-type: collector|policy|cataloger.
  #
  # Spreading redistributes pods; it does not add capacity. For per-subnet IP
  # exhaustion it helps when the pressure is lopsided, but prefix delegation and
  # subnet sizing remain the actual supply levers.
  # Example:
  #   scriptPodTopologySpreadConstraints:
  #     - maxSkew: 1
  #       topologyKey: topology.kubernetes.io/zone
  #       whenUnsatisfiable: ScheduleAnyway
  scriptPodTopologySpreadConstraints: []
  extraEnv: []
  resources: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Optional pod topology-spread constraints for operator replicas. Unlike the
  # hub (which soft-spreads by default), the operator runs a single replica by
  # default and applies NO spread unless you set this — empty means no
  # constraints. Set it (maxSkew / topologyKey / whenUnsatisfiable / ...) when
  # running the operator with replicaCount > 1 to spread its pods across nodes
  # or zones.
  #
  # This spreads the operator's OWN Deployment replicas ONLY. To spread the
  # script pods the operator creates at runtime, use
  # operator.scriptPodTopologySpreadConstraints above.
  topologySpreadConstraints: []
grafana:
  # How Grafana is provided. One of:
  #   chart    — the chart runs a bundled stock Grafana pod and provisions the
  #              Lunar dashboards into it (default).
  #   external — no bundled pod; the chart provisions the Lunar dashboards into a
  #              bring-your-own Grafana. Point the Hub at it via grafana.url +
  #              grafana.auth (below) — the chart wires them to the Hub for you (no
  #              hub.extraEnv plumbing). The external Grafana must also reach the
  #              Hub's Postgres for the read-only datasource.
  #   off      — no Grafana and no dashboard provisioning.
  # Replaces the chart <3.0.0 grafana.enabled + grafana.provisioning.enabled toggles
  # (grafana.enabled=true -> chart; =false -> external or off).
  mode: chart
  # URL where Grafana is reachable (was grafana.externalURL). Drives Grafana's own
  # GF_SERVER_ROOT_URL (OIDC redirect_uri, absolute links) and the Hub's
  # HUB_GRAFANA_URL_BASE ([More Details] PR-comment links).
  #   chart mode    — optional: derived from grafana.ingress.hosts[0].host when
  #                   chart-managed Grafana ingress is enabled; otherwise required —
  #                   the chart won't guess a URL it doesn't route to (wrong host =
  #                   silently broken OIDC). mode=chart fails fast if none is set.
  #   external mode — required: the base URL of your Grafana. The Hub vends it (+
  #                   auth below) to the provisioning tool.
  url: ""
  # Credentials the chart/Hub use to reach Grafana (was grafana.admin).
  #   chart mode    — basic admin login for the bundled pod. Leave secretName empty
  #                   to have the chart generate it (username "admin", 32-char
  #                   password; persisted across upgrade/uninstall via
  #                   helm.sh/resource-policy: keep) or set it to bring your own. It
  #                   seeds the pod's GF_SECURITY_ADMIN_* and is vended to the
  #                   provisioning tool as HUB_GRAFANA_USER/PASSWORD. Retrieve:
  #                     kubectl get secret <release>-grafana-admin \
  #                       -o jsonpath='{.data.password}' | base64 -d
  #   external mode — REQUIRED (the chart can't generate credentials for a Grafana
  #                   it doesn't own): the secret the Hub authenticates to your
  #                   Grafana with. Basic (userKey + passwordKey) or, when tokenKey
  #                   is set, a service-account token (Grafana Cloud/Enterprise).
  # tokenKey is external-only — the bundled pod uses basic admin auth.
  # GitOps users (ArgoCD/Flux): see README "GitOps note".
  auth:
    secretName: ""
    userKey: "username"
    passwordKey: "password"
    tokenKey: ""
  # Serve Grafana with no login: unauthenticated visitors get the Viewer role in
  # the default org and land straight on the dashboards (what makes the kiosk
  # sidecar useful without handing out the admin password). The admin login form
  # stays enabled, so Editor/Admin access is unchanged.
  #
  # chart mode only — [auth.anonymous] is a Grafana server setting read at boot,
  # so the chart can only apply it to the pod it owns. Setting it in external/off
  # mode fails the install rather than silently doing nothing.
  #
  # ONLY enable this when Grafana is not reachable from the internet. A Grafana
  # Viewer can issue arbitrary queries against every provisioned datasource —
  # restricting that is a Grafana Enterprise feature — so anonymous Viewer grants
  # anyone who can reach the Service read access to the whole Lunar database
  # through the read-only datasource.
  anonymousViewer: false
  extraEnv: []
  # Stock upstream Grafana — no Lunar-built/derived image (avoids the AGPL
  # implications and maintenance of shipping a modified Grafana). Plugins,
  # datasources and dashboards are installed over the API by the lunar-dashboards
  # provisioning tool (grafana.provisioning below).
  image:
    repository: "grafana/grafana"
    pullPolicy: IfNotPresent
    tag: "13.1.0"
  # lunar-dashboards provisioning tool: a run-to-completion image (entrypoint
  # deploy.sh) that installs plugins/datasources/dashboards over the Grafana API.
  # It resolves the target Grafana endpoint + a read-only DB connection from the
  # Hub over gRPC, so it needs no Grafana/DB args here.
  #
  # Runs on every Hub install/upgrade whenever grafana.mode != off, targeting the
  # chart's own Grafana pod (mode=chart: provisioned directly via the in-cluster
  # Service, admin auth auto-wired from the grafana-admin secret; a reconverge
  # sidecar on the pod also re-applies on every pod start, so a recreated pod
  # self-heals without waiting for the next Hub upgrade) or an external Grafana
  # (mode=external: endpoint resolved from the Hub). The read-only grafana_user DB
  # password (dbPassword below) is chart-generated — no operator config needed.
  provisioning:
    image:
      repository: "ghcr.io/earthly/lunar-dashboards"
      pullPolicy: IfNotPresent
      # Defaults to the hub image tag (hub.image.tag) so dashboards match the
      # running Hub's schema. Override to pin a specific tool version.
      tag: ""
    # Password for the read-only grafana_user DB role the provisioning tool's
    # datasource uses (the Hub vends the connection to the tool; it's never
    # user-facing). Leave secretName empty to have the chart generate it — a
    # pre-install/pre-upgrade hook secret, persisted across upgrades
    # (helm.sh/resource-policy: keep). Set secretName to bring your own
    # (recommended for GitOps; see grafana.auth note).
    dbPassword:
      secretName: ""
      passwordKey: "password"
    # securityContext / resources for the provisioning workloads — the provisioning
    # Job's containers and the reconverge sidecar. Separate from the grafana.* knobs
    # (which size the Grafana server) since this runs the lunar-dashboards tool.
    # podSecurityContext applies to the provisioning Job pod; the reconverge sidecar
    # shares the Grafana pod's grafana.podSecurityContext.
    podSecurityContext: {}
    securityContext: {}
    resources: {}
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
  labels: {}
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  # The kiosk sidecar (the nginx proxy that injects ?kiosk into dashboard
  # URLs). Kept separate from the grafana.* knobs above since it's a
  # different upstream image, different footprint, and runs as a different
  # uid than the Grafana server.
  kiosk:
    image:
      repository: "nginx"
      pullPolicy: IfNotPresent
      # Pinned tighter than a bare "1-alpine" so the exact build doesn't
      # drift per-node as upstream reslices that tag. Bump deliberately.
      tag: "1.31.3-alpine"
    resources: {}
    # securityContext for the kiosk sidecar. Separate from
    # grafana.securityContext since the nginx image runs as a different uid
    # than Grafana (grafana.securityContext's runAsUser, if set, does not
    # apply here) — e.g. stock nginx has no numeric user set at image level,
    # so runAsNonRoot requires an explicit runAsUser here.
    securityContext: {}
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Number of Grafana replicas. Grafana's own state (sessions, orgs,
  # annotations) lives in its database — see grafana.db below to point it at
  # Postgres instead of the default per-pod SQLite, so state is shared across
  # replicas rather than stranded on whichever pod a login landed on.
  replicaCount: 1
  # Grafana's own backend store (NOT the read-only datasource used by
  # dashboards — see grafana.provisioning.dbPassword for that). Defaults to
  # Grafana's built-in SQLite, which is fine at replicaCount 1 but strands
  # sessions/orgs/annotations per-pod once you scale out — a login on one
  # replica won't be recognized by another. Point this at Postgres (e.g. the
  # same instance as hub.db, with a dedicated database/role) to share state
  # across replicas; leave host empty to keep SQLite (single-replica only).
  # All six keys are required together; user and pass are secret references,
  # not literals:
  # db:
  #   host: "postgres.internal"
  #   port: 5432
  #   name: "grafana"
  #   sslMode: "require"
  #   user:
  #     secretName: "grafana-db"
  #     secretKey: "username"
  #   pass:
  #     secretName: "grafana-db"
  #     secretKey: "password"
  db: {}
  # Extra pod topology-spread constraints for Grafana replicas. Empty is NOT
  # "no spread" — the chart applies a soft default (maxSkew 1 across
  # kubernetes.io/hostname, ScheduleAnyway), matching hub. Set
  # this to override with your own; it replaces the default wholesale.
  topologySpreadConstraints: []
