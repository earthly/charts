name: Bump Version
run-name: "Bump to ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. "3.0.0"). Sets both Chart.yaml version and the lunar image tags — chart and hub versions are kept in lockstep.'
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          yq -i ".version = \"${VERSION}\"" charts/lunar/Chart.yaml
          yq -i ".hub.image.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.image.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.initImage.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.sidecarImage.tag = \"${VERSION}\"" charts/lunar/values.yaml
          # NOTE: grafana.image is intentionally NOT bumped — the chart runs stock
          # upstream grafana/grafana (its own version, e.g. 13.1.0), not a
          # lunar-tagged image. Dashboards/datasources/plugins are installed by the
          # lunar-dashboards provisioning tool, whose tag follows hub.image.tag.

      - name: Push release branch and open PR
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/lunar/Chart.yaml charts/lunar/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit; dispatching release reconciliation"
            gh workflow run release.yml --ref main
            exit 0
          fi
          BRANCH="release/${VERSION}"
          git checkout -b "${BRANCH}"
          git commit -m "Release ${VERSION}"
          git push -u origin "${BRANCH}"
          PR_URL=$(gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Release ${VERSION}" \
            --body "Automated bump from the \`lunar-hub-v${VERSION}\` release. Sets \`Chart.yaml\` version and the hub/operator/init/sidecar image tags in \`charts/lunar/values.yaml\` to \`${VERSION}\` (chart and hub versions stay in lockstep). Grafana runs stock \`grafana/grafana\` and is not retagged. The chart release is published by \`release.yml\` on merge to \`main\`.")
          gh pr merge --auto --squash "$PR_URL"
          for attempt in $(seq 1 90); do
            MERGED_AT=$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt // ""')
            if [ -n "$MERGED_AT" ]; then
              gh workflow run release.yml --ref main
              exit 0
            fi
            sleep 10
          done
          echo "::warning::release PR did not merge within 15 minutes; auto-merge remains enabled and the scheduled release reconciliation will publish it"
