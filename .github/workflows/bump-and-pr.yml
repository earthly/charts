name: Bump Version
run-name: "Bump chart for lunar-hub ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'lunar-hub image version to deploy (e.g. "2.4.1"). The chart''s own version auto-bumps its patch — it is independent of this.'
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update versions
        id: versions
        env:
          HUB_VERSION: ${{ inputs.version }}
        run: |
          # Image tags track the lunar-hub release being deployed.
          yq -i ".hub.image.tag = \"${HUB_VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.image.tag = \"${HUB_VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.initImage.tag = \"${HUB_VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.sidecarImage.tag = \"${HUB_VERSION}\"" charts/lunar/values.yaml
          yq -i ".grafana.image.tag = \"${HUB_VERSION}\"" charts/lunar/values.yaml

          # The chart versions INDEPENDENTLY of the hub. A bump that only re-points the
          # deployed hub image is, by definition, a chart patch — so auto-increment the
          # chart's own patch. Chart and hub versions are never coupled, and a chart that
          # happens to share a hub version no longer blocks the hub release.
          CUR=$(yq '.version' charts/lunar/Chart.yaml)
          if [[ ! "$CUR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::current chart version '$CUR' is not X.Y.Z — bump it manually" >&2
            exit 1
          fi
          CHART_VERSION=$(echo "$CUR" | awk -F. '{print $1"."$2"."$3+1}')
          yq -i ".version = \"${CHART_VERSION}\"" charts/lunar/Chart.yaml
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Chart ${CUR} -> ${CHART_VERSION}; image tags -> lunar-hub ${HUB_VERSION}"

      - name: Push release branch and open PR
        env:
          HUB_VERSION: ${{ inputs.version }}
          CHART_VERSION: ${{ steps.versions.outputs.chart_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/lunar/Chart.yaml charts/lunar/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="release/chart-${CHART_VERSION}"
          git checkout -b "${BRANCH}"
          git commit -m "Release chart ${CHART_VERSION} (lunar-hub ${HUB_VERSION})"
          git push -u origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Release chart ${CHART_VERSION} (lunar-hub ${HUB_VERSION})" \
            --body "Automated bump from the \`lunar-hub-v${HUB_VERSION}\` release. Sets the deployed image tags in \`charts/lunar/values.yaml\` to \`${HUB_VERSION}\`, and auto-bumps the chart's own \`Chart.yaml\` version to \`${CHART_VERSION}\` — chart and hub versions are independent. The chart release is published by \`release.yml\` on merge to \`main\`."
          gh pr merge --auto --squash "${BRANCH}"
