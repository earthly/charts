name: Bump Version
run-name: "Bump to ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. "2.2.0")'
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          yq -i ".version = \"${VERSION}\"" charts/lunar/Chart.yaml
          yq -i ".hub.image.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.image.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.initImage.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.sidecarImage.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".grafana.image.tag = \"${VERSION}\"" charts/lunar/values.yaml

      - name: Push release branch and open PR
        env:
          VERSION: ${{ inputs.version }}
          # Use a non-Actions token so the auto-merge to main triggers release.yml.
          # Pushes attributed to github-actions[bot] (i.e. the default GITHUB_TOKEN)
          # do not fire downstream `on: push` workflows; required `release.yml` to
          # be retriggered manually after PR #52 merged (lunar-2.2.1, 2026-05-27).
          GH_TOKEN: ${{ secrets.LUNAR_DIST_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/lunar/Chart.yaml charts/lunar/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="release/${VERSION}"
          git checkout -b "${BRANCH}"
          git commit -m "Release ${VERSION}"
          git push -u origin "${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Release ${VERSION}" \
            --body "Automated bump from \`lunar-hub-v${VERSION}\` release. Updates \`Chart.yaml\` version and all image tags in \`charts/lunar/values.yaml\` to \`${VERSION}\`. The chart release itself is published by \`release.yml\` on merge to \`main\`."
          gh pr merge --auto --squash "${BRANCH}"
