name: Bump Version
run-name: "Bump to ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. "2.2.0")'
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate release files from templates
        env:
          VERSION: ${{ inputs.version }}
        run: |
          envsubst '${VERSION}' < .github/templates/Chart-template.yaml > charts/lunar/Chart.yaml
          envsubst '${VERSION}' < .github/templates/values-template.yaml > charts/lunar/values.yaml

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/lunar/Chart.yaml charts/lunar/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release ${VERSION}"
            git push origin main
          fi
