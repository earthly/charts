name: Bump Version
run-name: "Bump to ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. "2.2.0")'
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          yq -i ".version = \"${VERSION}\"" charts/lunar/Chart.yaml
          yq -i ".hub.image.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.image.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.initImage.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".operator.sidecarImage.tag = \"${VERSION}\"" charts/lunar/values.yaml
          yq -i ".grafana.image.tag = \"${VERSION}\"" charts/lunar/values.yaml

      - name: Commit and push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/lunar/Chart.yaml charts/lunar/values.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release ${VERSION}"
            git push origin main
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
